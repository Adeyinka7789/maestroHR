# Phase E4c-i — test-profile datasource override (strategy A: tests run as postgres).
#
# The main application.yml flips the PRIMARY runtime datasource to the NOBYPASSRLS
# `maestro_app` role so RLS is enforced in production. The test suite, however, builds
# its fixtures with JPA inserts that have no tenant session bound (e.g. registering a
# tenant before its session exists) — those would be rejected by RLS WITH CHECK under
# `maestro_app`. For E4c-i we therefore keep the test datasource on the owner/superuser
# `postgres` role (which bypasses RLS), so the suite proves the read-wiring is correct
# without re-deriving every fixture under RLS. SQL-level RLS enforcement for
# `maestro_app` is already proven independently by RawConnectionRlsIsolationTest.
#
# This file is profile-specific (application-test.yml) so it layers ADDITIVELY over the
# base application.yml — only the datasource credentials are overridden; everything else
# (Flyway already pinned to postgres, privileged datasource, JPA, etc.) is inherited.
# The `test` profile is activated for all tests via the Surefire config in pom.xml.
spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Cap the primary Hikari pool per Spring test context. The suite caches many contexts
    # (up to the default 32), and each holds its own primary pool — with the default pool
    # size of 10 that can demand ~320 connections and trips Postgres "FATAL: sorry, too many
    # clients already" late in a full run. Tests are single-threaded per fork, so a small
    # pool is plenty; minimum-idle 0 + a short idle-timeout lets idle (cached-but-inactive)
    # contexts release their connections so concurrent usage stays well under max_connections.
    # A few payroll paths use REQUIRES_NEW on this datasource, so keep at least 3.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 60000
  kafka:
    # Resolve KAFKA_BOOTSTRAP_SERVERS without requiring the env var in CI/test runners.
    # fail-fast: false so missing broker does not abort context startup.
    # auto-startup: false so @KafkaListener containers never connect during tests.
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    listener:
      auto-startup: false

sentry:
  dsn: ""
  enabled: false
  traces-sample-rate: 0.0
