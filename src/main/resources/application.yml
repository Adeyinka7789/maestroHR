spring:
  application:
    name: maestrohr

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# Phase E4b: a second, privileged datasource for the handful of bootstrap and
# cross-tenant read operations that must see every tenant's rows (login lookups,
# webhook tenant-resolution, the lapse sweep, admin aggregates). It connects as the
# table owner / superuser (no set_config wrapper) so it bypasses RLS. Today it shares
# the primary's postgres credentials; it intentionally keeps its own connection
# settings so it stays postgres after E4c flips the PRIMARY datasource to maestro_app.
privileged:
  datasource:
    hikari:
      jdbc-url: ${PRIVILEGED_DB_URL:${DB_URL}}
      username: ${PRIVILEGED_DB_USERNAME:${DB_USERNAME}}
      password: ${PRIVILEGED_DB_PASSWORD:${DB_PASSWORD}}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Phase E4a: schema is owned entirely by Flyway. `validate` fails fast on any
      # entity/schema drift instead of silently mutating the database at boot.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The two settings below exist SPECIFICALLY for V18_1__add_clearance_items_updated_at.sql
    # — a back-dated migration (version 18.1) slotted between V18 and V19 to fix the fresh-DB
    # break (V19's INSERT referenced a column V18 never created). On databases already
    # migrated past it, 18.1 is "out of order":
    #   - out-of-order: lets `migrate` actually apply 18.1 (a no-op ALTER ... IF NOT EXISTS)
    #     instead of skipping it, so the history self-heals.
    #   - ignore-migration-patterns "*:ignored": lets the pre-migrate `validate` tolerate the
    #     one transient run where 18.1 is resolved-but-not-yet-applied, instead of failing.
    # Do NOT lean on these for ordinary work: every NEW migration must take the next
    # sequential version (V27, V28, ...), never a back-dated one.
    out-of-order: true
    ignore-migration-patterns: "*:ignored"
    placeholders:
      # Injected into V24__create_app_role.sql as ${app_db_password}.
      app_db_password: ${APP_DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080

spring.jpa.open-in-view: false

logging:
  level:
    root: WARN
    com.admtechhub.maestrohr: DEBUG
    org.flywaydb: INFO
    org.springframework.web: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) [%X{requestId:-na}/%X{tenantId:-na}] %clr(%-40.40logger{39}){cyan} : %msg%n"

security:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: 86400000
    refresh-expiry-ms: 604800000

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  base-url: https://api.paystack.co
  callback-url: http://localhost:8080/api/webhooks/paystack
  client-id: ${PAYSTACK_CLIENT_ID:}
  client-secret: ${PAYSTACK_CLIENT_SECRET:}
  oauth-callback-url: ${PAYSTACK_OAUTH_CALLBACK:http://localhost:8080/api/payment/oauth/callback}
  transaction-callback-url: ${PAYSTACK_TXN_CALLBACK:http://localhost:8080/dashboard?payment=success}
  webhook:
    verify-signature: ${PAYSTACK_VERIFY_WEBHOOK:true}

disbursement:
  default-provider: CSV
  providers:
    PAYSTACK:
      enabled: true
    FLUTTERWAVE:
      enabled: false
    CSV:
      enabled: true

mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

termii:
  api-key: ${TERMII_API_KEY}
  sender-id: MaestroHR
  base-url: https://api.termii.com/api

sentry:
  enabled: false
  dsn: ${SENTRY_DSN}
  traces-sample-rate: 1.0
  exception-resolver-order: -2147483648

web:
  resources:
    static-locations: classpath:/static/, file:uploads/