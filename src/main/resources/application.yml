spring:
  application:
    name: maestrohr

  # Document vault (V34) stores files in-row as BYTEA; DocumentService caps a single file at
  # 10 MB, so raise the multipart limits to match (the Spring default is 1 MB/file).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Phase E4c-i: the PRIMARY runtime datasource now connects as the least-privilege,
  # NOBYPASSRLS `maestro_app` role (created in V24), so PostgreSQL Row Level Security
  # actually applies to every JPA/repository read and write. The `set_config` wrapper in
  # DataSourceConfig binds `app.current_tenant` on each connection exactly as before —
  # `maestro_app` may set that custom GUC in its own session with no extra grant.
  # Bootstrap / cross-tenant reads that must see every tenant (login, webhooks, lapse
  # sweep, admin aggregates) deliberately go through the separate privileged datasource
  # below; un-migrated WRITE paths (registration inserts, admin write CRUD, login
  # failed-attempt write-backs) remain on this pool and are deferred to E4c-ii.
  datasource:
    url: ${DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# Phase E4b: a second, privileged (non-pooled) datasource for the handful of bootstrap
# and cross-tenant operations that must see every tenant's rows (login lookups,
# webhook tenant-resolution, the lapse sweep, admin aggregates, audit writes). It
# connects as the table owner / superuser (no set_config wrapper) so it bypasses RLS.
# Non-pooled (DriverManagerDataSource) to avoid exhausting max_connections when Spring
# caches multiple test contexts — each context already holds a primary Hikari pool.
# Credentials are read directly by PrivilegedDataSourceConfig via @Value; no YAML
# binding block is needed.

  jpa:
    hibernate:
      # Phase E4a: schema is owned entirely by Flyway. `validate` fails fast on any
      # entity/schema drift instead of silently mutating the database at boot.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway MUST run as the owner/superuser (postgres), NOT the primary runtime role
    # (NOBYPASSRLS, DML-only `maestro_app`, which cannot create flyway_schema_history on a
    # fresh DB or run V24's role management). The owner-credentialed datasource is supplied
    # explicitly by the @FlywayDataSource bean in config.FlywayConfig — setting
    # spring.flyway.user/password (or even url) here is NOT enough, because with a custom
    # @Primary datasource Boot reuses that (maestro_app) pool for Flyway and ignores them.
    # The two settings below exist SPECIFICALLY for V18_1__add_clearance_items_updated_at.sql
    # — a back-dated migration (version 18.1) slotted between V18 and V19 to fix the fresh-DB
    # break (V19's INSERT referenced a column V18 never created). On databases already
    # migrated past it, 18.1 is "out of order":
    #   - out-of-order: lets `migrate` actually apply 18.1 (a no-op ALTER ... IF NOT EXISTS)
    #     instead of skipping it, so the history self-heals.
    #   - ignore-migration-patterns "*:ignored": lets the pre-migrate `validate` tolerate the
    #     one transient run where 18.1 is resolved-but-not-yet-applied, instead of failing.
    # Do NOT lean on these for ordinary work: every NEW migration must take the next
    # sequential version (V27, V28, ...), never a back-dated one.
    out-of-order: true
    ignore-migration-patterns: "*:ignored"
    placeholders:
      # Injected into V24__create_app_role.sql as ${app_db_password}.
      app_db_password: ${APP_DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true        # prevents duplicates on retries
        max.block.ms: 3000               # send() must not block indefinitely on metadata/buffer
    consumer:
      group-id: maestrohr
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.admtechhub.maestrohr.*"
        reconnect.backoff.ms: 10000
        reconnect.backoff.max.ms: 60000
    admin:
      fail-fast: true                  # fail startup if broker is unreachable
      auto-create: false                # don't try to create topics on startup locally
    listener:
      ack-mode: manual
      retry:
        max-attempts: 3
        backoff:
          interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  forward-headers-strategy: framework

# Public base URL used to build links embedded in outgoing emails (login link,
# password-reset link). Override per environment via APP_URL.
app:
  url: ${APP_URL:http://localhost:8080}

spring.jpa.open-in-view: false

logging:
  level:
    root: WARN
    com.admtechhub.maestrohr: DEBUG
    org.flywaydb: INFO
    org.springframework.web: INFO
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) [%X{requestId:-na}/%X{tenantId:-na}] %clr(%-40.40logger{39}){cyan} : %msg%n"

security:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: 7200000
    refresh-expiry-ms: 604800000
    impersonation-expiry-ms: 1200000   # 20 minutes — short-lived, no refresh (Feature 4)

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  base-url: https://api.paystack.co
  # All callbacks derive from app.url (set APP_URL per environment) — no hardcoded host.
  # Each still accepts an explicit env override for edge cases (e.g. a distinct public host).
  callback-url: ${app.url}/api/webhooks/paystack
  client-id: ${PAYSTACK_CLIENT_ID:}
  client-secret: ${PAYSTACK_CLIENT_SECRET:}
  oauth-callback-url: ${PAYSTACK_OAUTH_CALLBACK:${app.url}/api/payment/oauth/callback}
  transaction-callback-url: ${PAYSTACK_TXN_CALLBACK:${app.url}/api/payment/callback}
  webhook:
    verify-signature: ${PAYSTACK_VERIFY_WEBHOOK:true}

disbursement:
  default-provider: CSV
  providers:
    PAYSTACK:
      enabled: true
    FLUTTERWAVE:
      enabled: false
    CSV:
      enabled: true

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

termii:
  api-key: ${TERMII_API_KEY}
  sender-id: MaestroHR
  base-url: https://api.termii.com/api

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true
  traces-sample-rate: 1.0
  exception-resolver-order: -2147483648
  ignored-exceptions-for-type:
    - org.springframework.web.HttpRequestMethodNotSupportedException
    - org.springframework.web.servlet.NoHandlerFoundException
    - org.springframework.security.access.AccessDeniedException
    # Expected client (4xx) errors handled by GlobalExceptionHandler — noise, not server faults.
    - org.springframework.web.bind.MethodArgumentNotValidException          # @Valid body failed (e.g. blank/invalid login email or password)
    - org.springframework.web.method.annotation.MethodArgumentTypeMismatchException  # bad typed path/query param
    - org.springframework.http.converter.HttpMessageNotReadableException    # missing/malformed JSON body
    - com.admtechhub.maestrohr.auth.InvalidCredentialsException             # wrong password / unknown email / locked account
    - com.admtechhub.maestrohr.auth.InvalidCredentialsException

web:
  resources:
    static-locations: classpath:/static/, file:uploads/

resilience4j:
  circuitbreaker:
    instances:
      paystack:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        # Ensure client payload errors (4xx) don't trip open the circuit breaker
        ignoreExceptions:
          - com.admtechhub.maestrohr.paystack.PaystackClient.PaystackApiException
  retry:
    instances:
      paystackRead:
        maxAttempts: 3
        waitDuration: 1s
        # ONLY retry on genuine network-level drops for read endpoints
        retryExceptions:
          - com.admtechhub.maestrohr.paystack.PaystackClient.PaystackNetworkException

