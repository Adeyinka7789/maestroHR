<!-- admin.html – content partial only -->
<style>
    /* Admin‑specific styles (not in layout.css) */
    .data-table th, .data-table td { text-align: left; }
    /* Stat cards etc. are already in layout.css, but we keep any overrides here if needed */
</style>

<div id="admin-content">
    <!-- Stats Cards -->
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px;">
        <div class="stat-card">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Tenants</div>
            <div id="stat-tenants" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Active Tenants</div>
            <div id="stat-active-tenants" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Users</div>
            <div id="stat-users" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Locked Users</div>
            <div id="stat-locked-users" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1.15fr 0.85fr;gap:16px;">
        <!-- Tenant Admin Section -->
        <div class="card" style="overflow:hidden;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e2e8f0;">
                <div>
                    <div style="font-size:18px;font-weight:600;">Tenant Admin</div>
                    <div style="font-size:13px;color:#64748b;">Create, update, activate, and manage subscriber workspaces.</div>
                </div>
                <button class="btn-primary" onclick="openTenantModal()">New Tenant</button>
            </div>
            <div class="overflow-x-auto">
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                        <th style="padding:12px 16px;text-align:left;">Company</th>
                        <th style="padding:12px 16px;text-align:left;">Plan</th>
                        <th style="padding:12px 16px;text-align:left;">Status</th>
                        <th style="padding:12px 16px;text-align:left;">Expires</th>
                        <th style="padding:12px 16px;text-align:right;"></th>
                    </tr>
                    </thead>
                    <tbody id="tenants-table-body">
                    <tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading tenants...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- User Admin Section -->
        <div class="card" style="overflow:hidden;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e2e8f0;">
                <div>
                    <div style="font-size:18px;font-weight:600;">User Admin</div>
                    <div style="font-size:13px;color:#64748b;">Manage roles, access, status, and unlock accounts.</div>
                </div>
                <button class="btn-primary" onclick="openUserModal()">New User</button>
            </div>
            <div class="overflow-x-auto">
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                        <th style="padding:12px 16px;text-align:left;">Email</th>
                        <th style="padding:12px 16px;text-align:left;">Role</th>
                        <th style="padding:12px 16px;text-align:left;">State</th>
                        <th style="padding:12px 16px;text-align:right;"></th>
                    </tr>
                    </thead>
                    <tbody id="users-table-body">
                    <tr><td colspan="4" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Tenant Modal -->
<div id="tenant-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:200;align-items:center;justify-content:center;">
    <div class="card" style="width:min(720px,92vw);padding:24px;">
        <h2 style="margin:0 0 16px;font-size:20px;">Tenant</h2>
        <input type="hidden" id="tenantId">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="grid-column:1 / -1;"><label class="form-label">Company Name</label><input class="form-input" id="tenantCompanyName"></div>
            <div><label class="form-label">RC Number</label><input class="form-input" id="tenantRcNumber"></div>
            <div><label class="form-label">Industry</label><input class="form-input" id="tenantIndustry"></div>
            <div><label class="form-label">Company Size</label><input class="form-input" id="tenantCompanySize"></div>
            <div><label class="form-label">Subscription Plan</label><select class="form-input" id="tenantPlan"><option value="FREE_TRIAL">FREE_TRIAL</option><option value="BASIC">BASIC</option><option value="PROFESSIONAL">PROFESSIONAL</option><option value="ENTERPRISE">ENTERPRISE</option></select></div>
            <div><label class="form-label">Subscription Expires</label><input class="form-input" type="datetime-local" id="tenantExpiresAt"></div>
            <div><label class="form-label">Status</label><select class="form-input" id="tenantActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
            <button class="btn-secondary" onclick="closeTenantModal()">Cancel</button>
            <button class="btn-primary" id="save-tenant-btn">Save Tenant</button>
        </div>
    </div>
</div>

<!-- User Modal -->
<div id="user-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:200;align-items:center;justify-content:center;">
    <div class="card" style="width:min(720px,92vw);padding:24px;">
        <h2 style="margin:0 0 16px;font-size:20px;">User</h2>
        <input type="hidden" id="userId">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="grid-column:1 / -1;"><label class="form-label">Email</label><input class="form-input" id="userEmail"></div>
            <div><label class="form-label">Tenant</label><select class="form-input" id="userTenantId"><option value="">Select Tenant</option></select></div>
            <div><label class="form-label">Role</label><select class="form-input" id="userRole"><option value="HR_ADMIN">HR_ADMIN</option><option value="FINANCE_OFFICER">FINANCE_OFFICER</option><option value="DEPT_MANAGER">DEPT_MANAGER</option><option value="EMPLOYEE">EMPLOYEE</option></select></div>
            <div><label class="form-label">Password</label><input class="form-input" id="userPassword" type="password" placeholder="Leave blank to keep unchanged"></div>
            <div><label class="form-label">Status</label><select class="form-input" id="userActive"><option value="true">Active</option><option value="false">Inactive</option></select></div>
            <div><label class="form-label">Unlock Account</label><select class="form-input" id="userUnlock"><option value="false">No</option><option value="true">Yes</option></select></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
            <button class="btn-secondary" onclick="closeUserModal()">Cancel</button>
            <button class="btn-primary" id="save-user-btn">Save User</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                return new Date(dateString).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) { return '-'; }
        }

        async function loadAdminData() {
            try {
                // Stats
                const statsRes = await apiCall('/api/admin/stats');
                const stats = await statsRes.json();
                if (stats.success) {
                    document.getElementById('stat-tenants').textContent = stats.data.tenants || 0;
                    document.getElementById('stat-active-tenants').textContent = stats.data.activeTenants || 0;
                    document.getElementById('stat-users').textContent = stats.data.users || 0;
                    document.getElementById('stat-locked-users').textContent = stats.data.lockedUsers || 0;
                }

                // Tenants
                const tenantsRes = await apiCall('/api/admin/tenants');
                const tenants = await tenantsRes.json();
                if (tenants.success && tenants.data) {
                    const tbody = document.getElementById('tenants-table-body');
                    if (tenants.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">No tenants found.办</td></tr>';
                    } else {
                        tbody.innerHTML = tenants.data.map(tenant => `
                            <tr style="border-bottom:1px solid #f8fafc;">
                                <td style="padding:14px 16px;">
                                    <div style="font-weight:600;">${escapeHtml(tenant.companyName)}</div>
                                    <div style="font-size:12px;color:#64748b;">${escapeHtml(tenant.industry)} · ${escapeHtml(tenant.companySize)}</div>
                                </td>
                                <td style="padding:14px 16px;">${escapeHtml(tenant.subscriptionPlan)}</td>
                                <td style="padding:14px 16px;"><span class="badge ${tenant.active ? 'badge-green' : 'badge-gray'}">${tenant.active ? 'Active' : 'Inactive'}</span></td>
                                <td style="padding:14px 16px;">${formatDate(tenant.subscriptionExpiresAt)}</td>
                                <td style="padding:14px 16px;text-align:right;">
                                    <button class="btn-secondary tenant-edit-btn" data-id="${tenant.id}" data-name="${escapeHtml(tenant.companyName)}" data-rc="${tenant.rcNumber || ''}" data-industry="${tenant.industry}" data-size="${tenant.companySize}" data-plan="${tenant.subscriptionPlan}" data-expires="${tenant.subscriptionExpiresAt || ''}" data-active="${tenant.active}" style="font-size:12px;padding:5px 10px;">Edit</button>
                                </td>
                            </tr>
                        `).join('');
                    }
                }

                // Users
                const usersRes = await apiCall('/api/admin/users');
                const users = await usersRes.json();
                if (users.success && users.data) {
                    const tbody = document.getElementById('users-table-body');
                    if (users.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="padding:48px 16px;text-align:center;color:#94a3b8;">No users found.办</td></tr>';
                    } else {
                        tbody.innerHTML = users.data.map(user => {
                            let badgeClass = 'badge-gray';
                            let badgeText = 'Inactive';
                            if (user.locked) { badgeClass = 'badge-red'; badgeText = 'Locked'; }
                            else if (user.active) { badgeClass = 'badge-green'; badgeText = 'Active'; }
                            return `
                                <tr style="border-bottom:1px solid #f8fafc;">
                                    <td style="padding:14px 16px;">
                                        <div style="font-weight:600;">${escapeHtml(user.email)}</div>
                                        <div style="font-size:12px;color:#64748b;">${escapeHtml(user.tenantId)}</div>
                                    </td>
                                    <td style="padding:14px 16px;">${escapeHtml(user.role)}</td>
                                    <td style="padding:14px 16px;"><span class="badge ${badgeClass}">${badgeText}</span></td>
                                    <td style="padding:14px 16px;text-align:right;">
                                        <button class="btn-secondary user-edit-btn" data-id="${user.id}" data-email="${escapeHtml(user.email)}" data-tenant="${user.tenantId}" data-role="${user.role}" data-active="${user.active}" data-locked="${user.locked}" style="font-size:12px;padding:5px 10px;">Edit</button>
                                    </td>
                                </tr>
                            `;
                        }).join('');
                    }
                }

                // Populate tenant dropdown for user modal
                const tenantsForDropdown = await apiCall('/api/admin/tenants');
                const tenantsData = await tenantsForDropdown.json();
                if (tenantsData.success && tenantsData.data) {
                    const tenantSelect = document.getElementById('userTenantId');
                    tenantSelect.innerHTML = '<option value="">Select Tenant</option>' + tenantsData.data.map(t => `<option value="${t.id}">${escapeHtml(t.companyName)}</option>`).join('');
                }

                attachTenantEditListeners();
                attachUserEditListeners();
            } catch (error) {
                console.error('Failed to load admin data:', error);
            }
        }

        function attachTenantEditListeners() {
            document.querySelectorAll('.tenant-edit-btn').forEach(btn => {
                btn.removeEventListener('click', handleTenantEdit);
                btn.addEventListener('click', handleTenantEdit);
            });
        }

        function handleTenantEdit(e) {
            const btn = e.currentTarget;
            document.getElementById('tenantId').value = btn.dataset.id;
            document.getElementById('tenantCompanyName').value = btn.dataset.name || '';
            document.getElementById('tenantRcNumber').value = btn.dataset.rc || '';
            document.getElementById('tenantIndustry').value = btn.dataset.industry || '';
            document.getElementById('tenantCompanySize').value = btn.dataset.size || '';
            document.getElementById('tenantPlan').value = btn.dataset.plan || 'FREE_TRIAL';
            document.getElementById('tenantExpiresAt').value = btn.dataset.expires ? new Date(btn.dataset.expires).toISOString().slice(0, 16) : '';
            document.getElementById('tenantActive').value = btn.dataset.active === 'true' ? 'true' : 'false';
            document.getElementById('tenant-modal').style.display = 'flex';
        }

        function attachUserEditListeners() {
            document.querySelectorAll('.user-edit-btn').forEach(btn => {
                btn.removeEventListener('click', handleUserEdit);
                btn.addEventListener('click', handleUserEdit);
            });
        }

        function handleUserEdit(e) {
            const btn = e.currentTarget;
            document.getElementById('userId').value = btn.dataset.id;
            document.getElementById('userEmail').value = btn.dataset.email || '';
            document.getElementById('userTenantId').value = btn.dataset.tenant || '';
            document.getElementById('userRole').value = btn.dataset.role || 'HR_ADMIN';
            document.getElementById('userActive').value = btn.dataset.active === 'true' ? 'true' : 'false';
            document.getElementById('userUnlock').value = btn.dataset.locked === 'true' ? 'true' : 'false';
            document.getElementById('userPassword').value = '';
            document.getElementById('user-modal').style.display = 'flex';
        }

        window.openTenantModal = function() {
            document.getElementById('tenantId').value = '';
            document.getElementById('tenantCompanyName').value = '';
            document.getElementById('tenantRcNumber').value = '';
            document.getElementById('tenantIndustry').value = '';
            document.getElementById('tenantCompanySize').value = '';
            document.getElementById('tenantPlan').value = 'FREE_TRIAL';
            document.getElementById('tenantExpiresAt').value = '';
            document.getElementById('tenantActive').value = 'true';
            document.getElementById('tenant-modal').style.display = 'flex';
        };

        window.closeTenantModal = function() {
            document.getElementById('tenant-modal').style.display = 'none';
        };

        window.openUserModal = function() {
            document.getElementById('userId').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userTenantId').value = '';
            document.getElementById('userRole').value = 'HR_ADMIN';
            document.getElementById('userActive').value = 'true';
            document.getElementById('userUnlock').value = 'false';
            document.getElementById('userPassword').value = '';
            document.getElementById('user-modal').style.display = 'flex';
        };

        window.closeUserModal = function() {
            document.getElementById('user-modal').style.display = 'none';
        };

        document.getElementById('save-tenant-btn').addEventListener('click', async () => {
            const id = document.getElementById('tenantId').value;
            const payload = {
                companyName: document.getElementById('tenantCompanyName').value.trim(),
                rcNumber: document.getElementById('tenantRcNumber').value.trim(),
                industry: document.getElementById('tenantIndustry').value.trim(),
                companySize: document.getElementById('tenantCompanySize').value.trim(),
                subscriptionPlan: document.getElementById('tenantPlan').value,
                subscriptionExpiresAt: document.getElementById('tenantExpiresAt').value ? new Date(document.getElementById('tenantExpiresAt').value).toISOString() : null,
                active: document.getElementById('tenantActive').value === 'true'
            };

            try {
                const url = id ? `/api/admin/tenants/${id}` : '/api/admin/tenants';
                const method = id ? 'PUT' : 'POST';
                const response = await apiCall(url, { method, body: JSON.stringify(payload) });
                const data = await response.json();
                if (!response.ok) { showToast(data.error || data.message || 'Failed to save tenant.', 'error'); return; }
                showToast('Tenant saved.', 'success');
                closeTenantModal();
                loadAdminData();
            } catch (error) {
                showToast('Failed to save tenant.', 'error');
            }
        });

        document.getElementById('save-user-btn').addEventListener('click', async () => {
            const id = document.getElementById('userId').value;
            const payload = {
                email: document.getElementById('userEmail').value.trim(),
                tenantId: document.getElementById('userTenantId').value,
                role: document.getElementById('userRole').value,
                password: document.getElementById('userPassword').value,
                active: document.getElementById('userActive').value === 'true',
                unlockAccount: document.getElementById('userUnlock').value === 'true'
            };

            try {
                const url = id ? `/api/admin/users/${id}` : '/api/admin/users';
                const method = id ? 'PUT' : 'POST';
                const response = await apiCall(url, { method, body: JSON.stringify(payload) });
                const data = await response.json();
                if (!response.ok) { showToast(data.error || data.message || 'Failed to save user.', 'error'); return; }
                showToast('User saved.', 'success');
                closeUserModal();
                loadAdminData();
            } catch (error) {
                showToast('Failed to save user.', 'error');
            }
        });

        // Close modals when clicking outside
        const tenantModal = document.getElementById('tenant-modal');
        const userModal = document.getElementById('user-modal');
        tenantModal.addEventListener('click', (e) => { if (e.target === tenantModal) closeTenantModal(); });
        userModal.addEventListener('click', (e) => { if (e.target === userModal) closeUserModal(); });

        loadAdminData();
    })();
</script>
