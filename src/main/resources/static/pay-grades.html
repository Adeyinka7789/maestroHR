<!-- pay-grades.html – content partial only -->
<style>
    .grade-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        padding: 0;
        overflow: hidden;
        transition: box-shadow 0.2s, transform 0.2s;
        display: flex;
        flex-direction: column;
    }
    .grade-card:hover {
        box-shadow: 0 8px 28px rgba(15,23,42,0.09);
        transform: translateY(-2px);
    }
    .grade-card-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
    }
    .grade-card-body {
        padding: 16px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0;
    }
    .grade-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid #f8fafc;
        font-size: 13px;
    }
    .grade-line:last-child { border-bottom: none; }
    .grade-line-label { color: #6b7280; display: flex; align-items: center; gap: 6px; }
    .grade-line-label-dot {
        width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .grade-line-value { font-weight: 500; color: #111827; font-family: 'DM Mono', monospace; font-size: 12.5px; }
    .grade-card-footer {
        padding: 14px 20px;
        background: #f8fafc;
        border-top: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .grade-gross-label { font-size: 11.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
    .grade-gross-value { font-size: 18px; font-weight: 700; color: #2563eb; font-family: 'DM Mono', monospace; }

    /* Modal redesign */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.5);
        z-index: 50;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
    }
    .modal-box {
        background: #fff;
        border-radius: 14px;
        width: min(540px, 92vw);
        box-shadow: 0 24px 64px rgba(15,23,42,0.18);
        overflow: hidden;
    }
    .modal-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid #f1f5f9;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        background: #f8fafc;
    }
    .modal-close-btn {
        background: none; border: none; cursor: pointer; color: #9ca3af;
        padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
        transition: color 0.15s, background 0.15s;
    }
    .modal-close-btn:hover { color: #374151; background: #f1f5f9; }
    .gross-preview-box {
        margin-top: 16px;
        padding: 14px 16px;
        background: linear-gradient(135deg, #eff6ff, #f0fdf4);
        border: 1px solid #dbeafe;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-with-prefix { position: relative; }
    .input-with-prefix input { padding-left: 32px !important; }
    .input-prefix {
        position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
        font-size: 13px; color: #6b7280; font-family: 'DM Mono', monospace; pointer-events: none;
    }

    /* Empty state */
    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 64px 24px;
        color: #94a3b8;
    }
    .empty-state-icon {
        width: 56px; height: 56px; background: #f1f5f9; border-radius: 14px;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    }
</style>

<!-- Page header -->
<div class="page-header">
    <div>
        <h1 class="page-title">Pay Grades</h1>
        <p class="page-subtitle">Maintain pay bands, salaries, and fixed allowances</p>
    </div>
    <button class="btn-primary" onclick="openPayGradeModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Pay Grade
    </button>
</div>

<!-- Summary bar -->
<div id="grades-summary" style="display:none; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
    <div class="card" style="padding:12px 18px; display:flex; align-items:center; gap:10px; flex:1; min-width:160px;">
        <div style="width:34px;height:34px;background:#eff6ff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div>
            <p style="font-size:11px;color:#6b7280;margin:0;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;">Total Grades</p>
            <p id="summary-total" style="font-size:20px;font-weight:700;color:#111827;margin:0;line-height:1.2;">0</p>
        </div>
    </div>
    <div class="card" style="padding:12px 18px; display:flex; align-items:center; gap:10px; flex:1; min-width:160px;">
        <div style="width:34px;height:34px;background:#f0fdf4;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
        <div>
            <p style="font-size:11px;color:#6b7280;margin:0;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;">Highest Gross</p>
            <p id="summary-highest" style="font-size:20px;font-weight:700;color:#111827;margin:0;line-height:1.2;font-family:'DM Mono',monospace;">₦0</p>
        </div>
    </div>
    <div class="card" style="padding:12px 18px; display:flex; align-items:center; gap:10px; flex:1; min-width:160px;">
        <div style="width:34px;height:34px;background:#faf5ff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div>
            <p style="font-size:11px;color:#6b7280;margin:0;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;">Avg Gross</p>
            <p id="summary-avg" style="font-size:20px;font-weight:700;color:#111827;margin:0;line-height:1.2;font-family:'DM Mono',monospace;">₦0</p>
        </div>
    </div>
</div>

<!-- Cards grid -->
<div id="pay-grades-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">
    <div class="empty-state">
        <div class="empty-state-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <p style="margin:0 0 4px; font-weight:500; color:#64748b;">Loading pay grades…</p>
    </div>
</div>

<!-- ── Modal ─────────────────────────────────────────────────── -->
<div id="pay-grade-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <h2 style="margin:0; font-size:16px; font-weight:600; color:#111827;" id="modal-heading">Add Pay Grade</h2>
                <p style="margin:3px 0 0; font-size:12px; color:#6b7280;">Values in Naira — stored internally as kobo</p>
            </div>
            <button class="modal-close-btn" onclick="closePayGradeModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="modal-body">
            <input type="hidden" id="gradeId">

            <!-- Name field -->
            <div class="input-group" style="margin-bottom:16px;">
                <label class="form-label">Grade Name <span style="color:#ef4444;">*</span></label>
                <input class="form-input" id="gradeName" placeholder="e.g., Senior Engineer, Level 3">
            </div>

            <!-- Salary fields grid -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="input-group">
                    <label class="form-label">Basic Salary</label>
                    <div class="input-with-prefix">
                        <span class="input-prefix">₦</span>
                        <input class="form-input" id="basicSalary" type="number" placeholder="0" min="0">
                    </div>
                </div>
                <div class="input-group">
                    <label class="form-label">Housing Allowance</label>
                    <div class="input-with-prefix">
                        <span class="input-prefix">₦</span>
                        <input class="form-input" id="housingAllowance" type="number" placeholder="0" min="0">
                    </div>
                </div>
                <div class="input-group">
                    <label class="form-label">Transport Allowance</label>
                    <div class="input-with-prefix">
                        <span class="input-prefix">₦</span>
                        <input class="form-input" id="transportAllowance" type="number" placeholder="0" min="0">
                    </div>
                </div>
                <div class="input-group">
                    <label class="form-label">Other Allowances</label>
                    <div class="input-with-prefix">
                        <span class="input-prefix">₦</span>
                        <input class="form-input" id="otherAllowances" type="number" placeholder="0" min="0">
                    </div>
                </div>
            </div>

            <!-- Gross preview -->
            <div class="gross-preview-box">
                <div>
                    <p style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;margin:0;">Gross Monthly</p>
                    <p style="font-size:11px;color:#94a3b8;margin:2px 0 0;">Basic + all allowances</p>
                </div>
                <div style="text-align:right;">
                    <p id="gross-preview" style="font-size:22px;font-weight:700;color:#2563eb;font-family:'DM Mono',monospace;margin:0;">₦0</p>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" onclick="closePayGradeModal()">Cancel</button>
            <button class="btn-primary" id="grade-save-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Save Grade
            </button>
        </div>
    </div>
</div>

<script>
    (function () {
        const { apiCall, showToast, escapeHtml } = window.MaestroHR;

        // Colour palette for line dots
        const DOT_COLORS = ['#2563eb', '#7c3aed', '#059669', '#d97706'];

        function formatCurrency(amountKobo) {
            const naira = (amountKobo || 0) / 100;
            return '₦' + naira.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function grossOf(g) {
            return (g.grossSalary) || (g.basicSalary + g.housingAllowance + g.transportAllowance + g.otherAllowances);
        }

        // ── Load & render ─────────────────────────────────────────────
        async function loadPayGrades() {
            const grid = document.getElementById('pay-grades-grid');
            try {
                const res    = await apiCall('/api/pay-grades');
                const result = await res.json();

                if (!result.success || !result.data) throw new Error('API error');

                const grades = result.data;

                if (grades.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            </div>
                            <p style="margin:0 0 4px;font-weight:500;color:#64748b;">No pay grades yet</p>
                            <p style="margin:0;font-size:13px;">Click "Add Pay Grade" to create your first band.</p>
                        </div>`;
                    document.getElementById('grades-summary').style.display = 'none';
                    return;
                }

                // Update summary bar
                const grossValues = grades.map(grossOf);
                const highest     = Math.max(...grossValues);
                const avg         = grossValues.reduce((a, b) => a + b, 0) / grossValues.length;
                document.getElementById('summary-total').textContent   = grades.length;
                document.getElementById('summary-highest').textContent = formatCurrency(highest);
                document.getElementById('summary-avg').textContent     = formatCurrency(Math.round(avg));
                document.getElementById('grades-summary').style.display = 'flex';

                // Sort highest gross first
                const sorted = [...grades].sort((a, b) => grossOf(b) - grossOf(a));

                const lines = [
                    { key: 'basicSalary',        label: 'Basic Salary',        color: DOT_COLORS[0] },
                    { key: 'housingAllowance',    label: 'Housing Allowance',   color: DOT_COLORS[1] },
                    { key: 'transportAllowance',  label: 'Transport Allowance', color: DOT_COLORS[2] },
                    { key: 'otherAllowances',     label: 'Other Allowances',    color: DOT_COLORS[3] },
                ];

                grid.innerHTML = sorted.map(grade => {
                    const gross = grossOf(grade);
                    const pct   = highest > 0 ? Math.round((gross / highest) * 100) : 0;

                    return `
                    <div class="grade-card">
                        <div class="grade-card-header">
                            <div style="min-width:0;">
                                <p style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;margin:0;">Grade</p>
                                <p style="font-size:17px;font-weight:700;color:#111827;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(grade.name)}</p>
                            </div>
                            <span class="badge ${grade.active !== false ? 'badge-green' : 'badge-gray'}" style="flex-shrink:0;">
                                ${grade.active !== false ? 'Active' : 'Inactive'}
                            </span>
                        </div>

                        <!-- Progress bar showing relative pay level -->
                        <div style="padding:12px 20px 0;">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                <span style="font-size:11px;color:#6b7280;">Relative pay level</span>
                                <span style="font-size:11px;font-weight:600;color:#2563eb;">${pct}%</span>
                            </div>
                            <div style="height:5px;background:#f1f5f9;border-radius:99px;overflow:hidden;">
                                <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:99px;transition:width 0.4s ease;"></div>
                            </div>
                        </div>

                        <div class="grade-card-body" style="margin-top:12px;">
                            ${lines.map(line => `
                            <div class="grade-line">
                                <span class="grade-line-label">
                                    <span class="grade-line-label-dot" style="background:${line.color};"></span>
                                    ${line.label}
                                </span>
                                <span class="grade-line-value">${formatCurrency(grade[line.key])}</span>
                            </div>`).join('')}
                        </div>

                        <div class="grade-card-footer">
                            <div>
                                <p class="grade-gross-label">Gross Monthly</p>
                                <p class="grade-gross-value">${formatCurrency(gross)}</p>
                            </div>
                            <button class="btn-secondary grade-edit-btn"
                                data-id="${grade.id}"
                                data-name="${escapeHtml(grade.name)}"
                                data-basic="${grade.basicSalary}"
                                data-housing="${grade.housingAllowance}"
                                data-transport="${grade.transportAllowance}"
                                data-other="${grade.otherAllowances}"
                                style="font-size:12.5px;padding:6px 14px;">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                Edit
                            </button>
                        </div>
                    </div>`;
                }).join('');

                // Attach edit listeners
                document.querySelectorAll('.grade-edit-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('modal-heading').textContent        = 'Edit Pay Grade';
                        document.getElementById('gradeId').value                   = btn.dataset.id;
                        document.getElementById('gradeName').value                  = btn.dataset.name;
                        document.getElementById('basicSalary').value               = btn.dataset.basic     ? btn.dataset.basic     / 100 : 0;
                        document.getElementById('housingAllowance').value          = btn.dataset.housing   ? btn.dataset.housing   / 100 : 0;
                        document.getElementById('transportAllowance').value        = btn.dataset.transport ? btn.dataset.transport / 100 : 0;
                        document.getElementById('otherAllowances').value           = btn.dataset.other     ? btn.dataset.other     / 100 : 0;
                        updateGrossPreview();
                        document.getElementById('pay-grade-modal').style.display = 'flex';
                    });
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        </div>
                        <p style="margin:0;font-weight:500;color:#ef4444;">Failed to load pay grades</p>
                    </div>`;
            }
        }

        // ── Gross preview ─────────────────────────────────────────────
        function updateGrossPreview() {
            const basic     = Number(document.getElementById('basicSalary').value)       || 0;
            const housing   = Number(document.getElementById('housingAllowance').value)  || 0;
            const transport = Number(document.getElementById('transportAllowance').value)|| 0;
            const other     = Number(document.getElementById('otherAllowances').value)   || 0;
            document.getElementById('gross-preview').textContent = '₦' + (basic + housing + transport + other).toLocaleString('en-NG');
        }

        // ── Modal open/close ──────────────────────────────────────────
        window.openPayGradeModal = function () {
            document.getElementById('modal-heading').textContent   = 'Add Pay Grade';
            document.getElementById('gradeId').value               = '';
            document.getElementById('gradeName').value             = '';
            document.getElementById('basicSalary').value           = '';
            document.getElementById('housingAllowance').value      = '';
            document.getElementById('transportAllowance').value    = '';
            document.getElementById('otherAllowances').value       = '';
            updateGrossPreview();
            document.getElementById('pay-grade-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('gradeName').focus(), 50);
        };

        window.closePayGradeModal = function () {
            document.getElementById('pay-grade-modal').style.display = 'none';
        };

        // Close on backdrop click
        document.getElementById('pay-grade-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('pay-grade-modal')) closePayGradeModal();
        });

        // Live gross preview
        ['basicSalary','housingAllowance','transportAllowance','otherAllowances'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateGrossPreview);
        });

        // ── Save ──────────────────────────────────────────────────────
        document.getElementById('grade-save-btn').addEventListener('click', async () => {
            const id      = document.getElementById('gradeId').value;
            const name    = document.getElementById('gradeName').value.trim();

            if (!name) { showToast('Grade name is required.', 'error'); return; }

            const payload = {
                name,
                basicSalary:        (Number(document.getElementById('basicSalary').value)        || 0) * 100,
                housingAllowance:   (Number(document.getElementById('housingAllowance').value)   || 0) * 100,
                transportAllowance: (Number(document.getElementById('transportAllowance').value) || 0) * 100,
                otherAllowances:    (Number(document.getElementById('otherAllowances').value)    || 0) * 100,
            };

            try {
                const res    = await apiCall(id ? `/api/pay-grades/${id}` : '/api/pay-grades', {
                    method: id ? 'PUT' : 'POST',
                    body:   JSON.stringify(payload)
                });
                const result = await res.json();
                if (!res.ok) { showToast(result.error || result.message || 'Save failed.', 'error'); return; }
                showToast('Pay grade saved.', 'success');
                closePayGradeModal();
                loadPayGrades();
            } catch {
                showToast('Network error — could not save.', 'error');
            }
        });

        // ── Init ──────────────────────────────────────────────────────
        loadPayGrades();
    }());
</script>
