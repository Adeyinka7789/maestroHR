<!-- subscribers.html – content partial only -->
<style>
    /* Page‑specific styles (not in layout.css) */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 19px; font-weight: 600; color: #0b1c30; }
    .page-subtitle { font-size: 13px; color: #444651; margin-top: 2px; }
</style>

<div id="subscribers-content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Subscribers</h1>
            <p class="page-subtitle">Tenant portfolio, subscription plans, and account posture.</p>
        </div>
        <a href="/htmx/admin" class="btn-secondary">Open Admin Console</a>
    </div>

    <!-- Filter Bar -->
    <div class="card" style="padding:16px;margin-bottom:16px;">
        <div style="display:grid;grid-template-columns:1fr 180px 180px;gap:10px;">
            <input class="form-input" id="subscriber-filter" placeholder="Filter by company, industry, RC, or plan">
            <select class="form-input" id="subscriber-status-filter">
                <option value="">All statuses</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
            <select class="form-input" id="subscriber-plan-filter">
                <option value="">All plans</option>
                <option value="FREE_TRIAL">FREE_TRIAL</option>
                <option value="BASIC">BASIC</option>
                <option value="PROFESSIONAL">PROFESSIONAL</option>
                <option value="ENTERPRISE">ENTERPRISE</option>
            </select>
        </div>
    </div>

    <!-- Stats Cards -->
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px;">
        <div class="stat-card">
            <div style="font-size:12px;color:#444651;text-transform:uppercase;">Subscribers</div>
            <div id="stat-subscribers" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#444651;text-transform:uppercase;">Active</div>
            <div id="stat-active" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#444651;text-transform:uppercase;">Trials</div>
            <div id="stat-trials" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size:12px;color:#444651;text-transform:uppercase;">Users</div>
            <div id="stat-users" style="font-size:30px;font-weight:600;margin-top:8px;">0</div>
        </div>
    </div>

    <!-- Subscribers Table -->
    <div class="card" style="overflow:hidden;">
        <div class="overflow-x-auto">
            <table class="data-table" style="width:100%;border-collapse:collapse;">
                <thead>
                <tr style="background:#eff4ff;border-bottom:1px solid #c5c5d3;">
                    <th style="padding:12px 16px;text-align:left;">Company</th>
                    <th style="padding:12px 16px;text-align:left;">Industry</th>
                    <th style="padding:12px 16px;text-align:left;">Plan</th>
                    <th style="padding:12px 16px;text-align:left;">Status</th>
                    <th style="padding:12px 16px;text-align:left;">Expires</th>
                    <th style="padding:12px 16px;text-align:left;">RC</th>
                    <th style="padding:12px 16px;text-align:left;">Users</th>
                </tr>
                </thead>
                <tbody id="subscribers-table-body">
                <tr><td colspan="7" style="padding:48px 16px;text-align:center;color:#757682;">Loading subscribers...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                return new Date(dateString).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) { return '-'; }
        }

        let allTenants = [];

        async function loadSubscribersData() {
            try {
                const response = await apiCall('/api/admin/tenants');
                const result = await response.json();
                if (result.success && result.data) {
                    allTenants = result.data;
                    renderSubscribersTable(allTenants);
                    updateStats(allTenants);
                } else {
                    throw new Error('Failed to load subscribers');
                }
            } catch (error) {
                console.error('Failed to load subscribers:', error);
                document.getElementById('subscribers-table-body').innerHTML = '<tr><td colspan="7" style="padding:48px 16px;text-align:center;color:#757682;">Failed to load subscribers.<\/td></tr>';
            }
        }

        function updateStats(tenants) {
            const total = tenants.length;
            const active = tenants.filter(t => t.active).length;
            const trials = tenants.filter(t => t.subscriptionPlan === 'FREE_TRIAL').length;
            const totalUsers = tenants.reduce((sum, t) => sum + (t.userCount || 0), 0);

            document.getElementById('stat-subscribers').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-trials').textContent = trials;
            document.getElementById('stat-users').textContent = totalUsers;
        }

        function renderSubscribersTable(tenants) {
            const tbody = document.getElementById('subscribers-table-body');
            if (tenants.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="padding:48px 16px;text-align:center;color:#757682;">No subscribers found.<\/td></tr>';
                return;
            }
            tbody.innerHTML = tenants.map(tenant => `
                <tr class="subscriber-row" style="border-bottom:1px solid #eff4ff;"
                    data-search="${(tenant.companyName + ' ' + tenant.industry + ' ' + (tenant.rcNumber || '') + ' ' + tenant.subscriptionPlan).toLowerCase()}"
                    data-status="${tenant.active ? 'Active' : 'Inactive'}"
                    data-plan="${tenant.subscriptionPlan}">
                    <td style="padding:14px 16px;font-weight:600;">${escapeHtml(tenant.companyName)}</td>
                    <td style="padding:14px 16px;">${escapeHtml(tenant.industry)} · ${escapeHtml(tenant.companySize)}</td>
                    <td style="padding:14px 16px;">${escapeHtml(tenant.subscriptionPlan)}</td>
                    <td style="padding:14px 16px;"><span class="badge ${tenant.active ? 'badge-green' : 'badge-gray'}">${tenant.active ? 'Active' : 'Inactive'}</span></td>
                    <td style="padding:14px 16px;">${formatDate(tenant.subscriptionExpiresAt)}</td>
                    <td style="padding:14px 16px;">${tenant.rcNumber || '—'}</td>
                    <td style="padding:14px 16px;">${tenant.userCount || 0}</td>
                </tr>
            `).join('');
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('subscriber-filter').value.trim().toLowerCase();
            const status = document.getElementById('subscriber-status-filter').value;
            const plan = document.getElementById('subscriber-plan-filter').value;
            const rows = document.querySelectorAll('.subscriber-row');
            rows.forEach(row => {
                const matchesQuery = !query || row.dataset.search.includes(query);
                const matchesStatus = !status || row.dataset.status === status;
                const matchesPlan = !plan || row.dataset.plan === plan;
                row.style.display = matchesQuery && matchesStatus && matchesPlan ? '' : 'none';
            });
        }

        document.getElementById('subscriber-filter').addEventListener('input', applyFilters);
        document.getElementById('subscriber-status-filter').addEventListener('change', applyFilters);
        document.getElementById('subscriber-plan-filter').addEventListener('change', applyFilters);

        loadSubscribersData();
    })();
</script>
