<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-tag">MaestroHR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Stitch design-system fonts (used by redesigned pages, starting with the dashboard) -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/layout.css">
    <!-- Compiled Stitch tokens (preflight-off; additive — scoped to redesigned pages) -->
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="bg-slate-50">

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside style="background:#0f172a; display:flex; flex-direction:column; border-right:1px solid #1e293b;">

        <!-- Brand header with hamburger toggle -->
        <div style="padding:18px 12px 14px; border-bottom:1px solid #1e293b; flex-shrink:0;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
                    <div style="width:32px; height:32px; background:linear-gradient(135deg,#2563eb,#1d4ed8); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 8px rgba(37,99,235,0.4);">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div class="sidebar-brand" style="min-width:0;">
                        <p style="font-size:14px; font-weight:600; color:#f1f5f9; line-height:1.2;">MaestroHR</p>
                        <p id="sidebar-tenant" style="font-size:11px; color:#64748b; margin-top:1px;">HR &amp; Payroll</p>
                    </div>
                </div>
                <!-- Hamburger menu toggle -->
                <button id="sidebar-toggle" class="sidebar-toggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Navigation – all routes with HTMX attributes and data-label for tooltips -->
        <nav style="flex:1; padding:6px 8px; overflow-y:auto; overflow-x:hidden;">

            <div id="hr-sections">
            <div class="nav-section"><span class="nav-section-label">Main</span></div>
            <a href="/htmx/dashboard" class="nav-item" data-route="dashboard" data-label="Dashboard"
               hx-get="/htmx/dashboard" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="/htmx/employees" class="nav-item" data-route="employees" data-label="Employees"
               hx-get="/htmx/employees" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="nav-label">Employees</span>
            </a>
            <a href="/htmx/departments" class="nav-item" data-route="departments" data-label="Departments"
               hx-get="/htmx/departments" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Departments</span>
            </a>
            <a href="/htmx/pay-grades" class="nav-item" data-route="pay-grades" data-label="Pay Grades"
               hx-get="/htmx/pay-grades" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span class="nav-label">Pay Grades</span>
            </a>

            <div class="nav-section"><span class="nav-section-label">Payroll</span></div>
            <a href="/htmx/payroll" class="nav-item" data-route="payroll" data-label="Payroll Runs"
               hx-get="/htmx/payroll" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <span class="nav-label">Payroll Runs</span>
            </a>
            <a href="/htmx/reports" class="nav-item" data-route="reports" data-label="Reports"
               hx-get="/htmx/reports" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span class="nav-label">Reports</span>
            </a>

            <div class="nav-section"><span class="nav-section-label">HR</span></div>
            <a href="/htmx/leave" class="nav-item" data-route="leave" data-label="Leave Management"
               hx-get="/htmx/leave" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="nav-label">Leave Management</span>
            </a>
            <a href="/htmx/attendance" class="nav-item" data-route="attendance" data-label="Attendance"
               hx-get="/htmx/attendance" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span class="nav-label">Attendance</span>
            </a>
            <a href="/htmx/attendance/me" class="nav-item" data-route="attendance-me" data-label="My Attendance"
               hx-get="/htmx/attendance/me" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                <span class="nav-label">My Attendance</span>
            </a>
            <a href="/htmx/payslips" class="nav-item" data-route="payslips" data-label="My Payslips"
               hx-get="/htmx/payslips" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
                <span class="nav-label">My Payslips</span>
            </a>

            <div class="nav-section"><span class="nav-section-label">System</span></div>
            <a href="/htmx/audit" class="nav-item" data-route="audit" data-label="Audit Logs"
               hx-get="/htmx/audit" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="nav-label">Audit Logs</span>
            </a>
            <a href="/htmx/settings" class="nav-item" data-route="settings" data-label="Settings"
               hx-get="/htmx/settings" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span class="nav-label">Settings</span>
            </a>

            </div><!-- /#hr-sections -->

            <div id="admin-section" style="display:none;">
                <div class="nav-section"><span class="nav-section-label">Admin</span></div>
                <a href="/htmx/admin" class="nav-item" data-route="admin" data-label="Admin Dashboard"
                   hx-get="/htmx/admin" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4.354a4 4 0 1 1 0 5.292M15 21H3v-1a6 6 0 0 1 12 0v1zm0 0h6v-1a6 6 0 0 0-9-5.197"/></svg>
                    <span class="nav-label">Admin Dashboard</span>
                </a>
                <a href="/htmx/admin/pricing" class="nav-item" data-route="admin-pricing" data-label="Pricing Plans"
                   hx-get="/htmx/admin/pricing" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    <span class="nav-label">Pricing Plans</span>
                </a>
                <a href="/htmx/admin/billing" class="nav-item" data-route="admin-billing" data-label="Billing Control"
                   hx-get="/htmx/admin/billing" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h2m4 0h4M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
                    <span class="nav-label">Billing Control</span>
                </a>
                <a href="/htmx/subscribers" class="nav-item" data-route="subscribers" data-label="Subscribers"
                   hx-get="/htmx/subscribers" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span class="nav-label">Subscribers</span>
                </a>
            </div>
        </nav>

        <!-- User footer -->
        <div style="padding:10px 8px; border-top:1px solid #1e293b; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:9px; padding:8px; border-radius:7px; transition:background 0.15s;">
                <div id="sidebar-avatar" style="width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#2563eb,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:white; flex-shrink:0;">A</div>
                <div class="sidebar-footer-meta" style="flex:1; min-width:0;">
                    <p id="sidebar-email" style="font-size:12.5px; font-weight:500; color:#e2e8f0; margin:0;">User</p>
                    <p id="sidebar-role" style="font-size:11px; color:#64748b; margin:2px 0 0;">—</p>
                </div>
                <button id="logout-btn" title="Sign out" style="background:none; border:none; cursor:pointer; color:#64748b; padding:4px; border-radius:5px; flex-shrink:0;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="flex flex-col flex-1 overflow-hidden sidebar-content">

        <!-- Topbar -->
        <header style="height:56px; background:white; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0;">
            <div>
                <span id="page-heading" style="font-size:15px; font-weight:600; color:#111827;">Dashboard</span>
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
                <div class="top-search">
                    <input id="global-search-input" class="form-input" type="search" placeholder="Search employees, payroll, leave...">
                    <div id="global-search-results" class="top-search-results"></div>
                </div>
                <div style="position:relative;">
                    <button id="notification-toggle" style="background:none; border:none; cursor:pointer; color:#6b7280; padding:5px; border-radius:6px; position:relative;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span id="notification-badge" style="display:none; position:absolute; top:1px; right:1px; min-width:15px; height:15px; padding:0 4px; border-radius:999px; background:#dc2626; color:white; font-size:9.5px; font-weight:600; text-align:center; line-height:15px;"></span>
                    </button>
                    <div id="notification-panel" class="notification-panel">
                        <div style="padding:12px 14px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;">
                            <strong style="font-size:13px;">Notifications</strong>
                            <button id="mark-all-read-btn" style="background:none; border:none; color:#2563eb; font-size:12px; cursor:pointer;">Mark all read</button>
                        </div>
                        <div id="notification-list"></div>
                    </div>
                </div>
                <span id="current-date" style="font-size:12px; color:#9ca3af; font-family:'DM Mono',monospace;"></span>
            </div>
        </header>

        <!-- HTMX target: all page partials are injected here -->
        <main id="page-content" class="flex-1 overflow-y-auto" style="padding:24px;">
            <!-- Skeleton loader (replaces old "Loading..." text) -->
            <div class="space-y-4">
                <div class="skeleton skeleton-header"></div>
                <div class="grid grid-cols-4 gap-4">
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                </div>
                <div class="skeleton-card mt-6">
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-line w-3/4"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="toast-container"></div>

<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
