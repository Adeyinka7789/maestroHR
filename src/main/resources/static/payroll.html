<!-- payroll.html – content partial only -->
<style>
    /* Page‑specific styles if any – all shared styles are in layout.css */
</style>

<div id="payroll-content">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
        <div class="card" style="padding:22px;">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Pending Approval</div>
            <div id="pending-approvals-count" style="font-size:32px;font-weight:600;margin-top:8px;">0</div>
            <div style="margin-top:14px;color:#64748b;font-size:13px;">Runs waiting on approval or disbursement decisions.</div>
        </div>
        <div class="card" style="padding:22px;">
            <div style="display:flex;gap:10px;align-items:end;">
                <div style="flex:1;"><label class="form-label">Month</label><input class="form-input" id="payrollMonth" type="number" min="1" max="12"></div>
                <div style="flex:1;"><label class="form-label">Year</label><input class="form-input" id="payrollYear" type="number" min="2024" max="2099"></div>
                <button class="btn-primary" id="initiate-payroll-btn">Initiate</button>
            </div>
        </div>
    </div>

    <div class="card" style="overflow:hidden;">
        <div class="overflow-x-auto">
            <table class="data-table" style="width:100%;border-collapse:collapse;">
                <thead>
                <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:12px 16px;text-align:left;">Period</th>
                    <th style="padding:12px 16px;text-align:left;">Status</th>
                    <th style="padding:12px 16px;text-align:left;">Net</th>
                    <th style="padding:12px 16px;text-align:left;">Initiated By</th>
                    <th style="padding:12px 16px;text-align:right;"></th>
                </tr>
                </thead>
                <tbody id="payroll-runs-table-body">
                <tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading payroll runs...</span></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const userRole = MaestroHR.userRole;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatCurrency(amountKobo) {
            const naira = (amountKobo || 0) / 100;
            return '₦' + naira.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function getBadgeClass(status) {
            if (status === 'APPROVED') return 'badge-green';
            if (status === 'REJECTED') return 'badge-red';
            if (status === 'DRAFT') return 'badge-blue';
            if (status === 'PENDING_APPROVAL') return 'badge-amber';
            if (status === 'DISBURSING') return 'badge-amber';
            if (status === 'COMPLETED') return 'badge-green';
            return 'badge-gray';
        }

        function hasPayrollAccess() {
            return userRole === 'HR_ADMIN' || userRole === 'FINANCE_OFFICER' || userRole === 'SUPER_ADMIN';
        }

        async function loadPayrollData() {
            const tbody = document.getElementById('payroll-runs-table-body');

            if (!hasPayrollAccess()) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">You do not have permission to view payroll runs. Only HR Admins, Finance Officers, and Super Admins can access this page.办</td></tr>';
                document.getElementById('pending-approvals-count').textContent = '—';
                document.getElementById('initiate-payroll-btn').disabled = true;
                return;
            }

            tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading...</span></tr>';

            try {
                // Load pending approvals count
                try {
                    const pendingRes = await apiCall('/api/payroll/pending-count');
                    if (pendingRes.ok) {
                        const pending = await pendingRes.json();
                        document.getElementById('pending-approvals-count').textContent = pending.data?.count || 0;
                    } else {
                        document.getElementById('pending-approvals-count').textContent = '0';
                    }
                } catch (e) {
                    document.getElementById('pending-approvals-count').textContent = '0';
                }

                const runsRes = await apiCall('/api/payroll');
                if (!runsRes.ok) {
                    if (runsRes.status === 403) {
                        tbody.innerHTML = `<td><td colspan="5" style="padding:48px 16px;text-align:center;color:#ef4444;">Access denied. Your role "${escapeHtml(userRole)}" does not have permission to view payroll.办</td></tr>`;
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#ef4444;">Failed to load payroll runs. Please try again.办</td></tr>';
                    }
                    return;
                }

                const runs = await runsRes.json();
                let runsData = runs.data || (Array.isArray(runs) ? runs : []);

                if (runsData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">No payroll runs yet. Start by initiating a new run above.办</td></tr>';
                } else {
                    tbody.innerHTML = runsData.map(run => `
                        <tr style="border-bottom:1px solid #f8fafc;">
                            <td style="padding:14px 16px;font-weight:500;">${escapeHtml(run.period || 'N/A')}</td>
                            <td style="padding:14px 16px;"><span class="badge ${getBadgeClass(run.status)}">${escapeHtml(run.status || 'DRAFT')}</span></td>
                            <td style="padding:14px 16px;">${formatCurrency(run.totalNet)}</td>
                            <td style="padding:14px 16px;">${escapeHtml(run.initiatedBy?.email || '-')}</td>
                            <td style="padding:14px 16px;text-align:right;">
                                <a href="/htmx/payroll-detail?id=${run.id}" class="btn-secondary" style="font-size:12px;padding:5px 10px;text-decoration:none;">Open</a>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Failed to load payroll data:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#ef4444;">Failed to load payroll runs. Check console for details.办</td></tr>';
            }
        }

        // Set default month/year
        const now = new Date();
        document.getElementById('payrollMonth').value = now.getMonth() + 1;
        document.getElementById('payrollYear').value = now.getFullYear();

        // Initiate payroll button
        const initiateBtn = document.getElementById('initiate-payroll-btn');
        initiateBtn.addEventListener('click', async () => {
            if (!hasPayrollAccess()) {
                showToast('You do not have permission to initiate payroll.', 'error');
                return;
            }
            const month = document.getElementById('payrollMonth').value;
            const year = document.getElementById('payrollYear').value;
            if (!month || !year) {
                showToast('Please enter month and year', 'error');
                return;
            }
            try {
                const response = await apiCall(`/api/payroll/initiate?month=${month}&year=${year}`, { method: 'POST' });
                const result = await response.json();
                if (!response.ok) {
                    showToast(result.error || result.message || 'Payroll initiation failed.', 'error');
                    return;
                }
                showToast('Payroll initiated successfully.', 'success');
                loadPayrollData();
            } catch (error) {
                showToast('Failed to initiate payroll', 'error');
            }
        });

        loadPayrollData();
    })();
</script>
