<!-- reports.html – content partial only -->
<style>
    /* Page‑specific styles – all shared styles are in layout.css */
</style>

<div id="reports-content">
    <!-- Stats Cards -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;">
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Employees</div><div id="stats-employees" style="font-size:30px;font-weight:600;margin-top:8px;">—</div></div>
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Departments</div><div id="stats-departments" style="font-size:30px;font-weight:600;margin-top:8px;">—</div></div>
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Pending Leave</div><div id="stats-pending-leave" style="font-size:30px;font-weight:600;margin-top:8px;">—</div></div>
    </div>

    <!-- Recent Payroll Runs & Payslip Download -->
    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px;">
        <div class="card" style="padding:22px;">
            <h2 style="margin:0 0 14px;font-size:18px;">Recent Payroll Runs</h2>
            <div id="recent-payroll-runs" style="display:grid;gap:10px;">
                <div class="text-center py-4 text-gray-500">Loading...</div>
            </div>
        </div>

        <div class="card" style="padding:22px;">
            <h2 style="margin:0 0 14px;font-size:18px;">Payslip Download</h2>
            <div style="display:grid;gap:10px;">
                <select class="form-input" id="payslipEmployeeId">
                    <option value="">Select employee</option>
                </select>
                <button id="download-payslip-btn" class="btn-primary" style="justify-content:center;">Download Latest Payslip</button>
            </div>
        </div>
    </div>

    <!-- Payroll Schedules & Workforce Reports -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="card" style="padding:22px;">
            <h2 style="margin:0 0 14px;font-size:18px;">Payroll Schedules</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;margin-bottom:14px;">
                <div><label class="form-label">Month</label><input class="form-input" type="number" id="reportMonth" min="1" max="12" value="5"></div>
                <div><label class="form-label">Year</label><input class="form-input" type="number" id="reportYear" min="2024" max="2099" value="2026"></div>
                <div><label class="form-label">Format</label><select class="form-input" id="reportFormat"><option value="PDF">PDF</option><option value="XLSX">Excel</option></select></div>
            </div>
            <div style="display:grid;gap:10px;">
                <button class="btn-secondary report-btn" data-report="monthly-payroll-summary">Monthly Payroll Summary</button>
                <button class="btn-secondary report-btn" data-report="paye-schedule">PAYE Schedule (Form A)</button>
                <button class="btn-secondary report-btn" data-report="pension-schedule">Pension Schedule</button>
                <button class="btn-secondary report-btn" data-report="nhf-schedule">NHF Schedule</button>
                <button id="pencom-report-btn" class="btn-secondary" style="margin-top:10px;">📄 PenCom Pension Report (RSA)</button>
                <button id="nsitf-report-btn" class="btn-secondary" style="margin-top:10px;">📄 NSITF Contribution Report</button>
            </div>
        </div>

        <div class="card" style="padding:22px;">
            <h2 style="margin:0 0 14px;font-size:18px;">Workforce Reports</h2>
            <div style="display:grid;gap:12px;">
                <div style="display:flex;gap:10px;">
                    <button id="headcount-report-btn" class="btn-secondary" style="flex:1;">Employee Headcount</button>
                    <button id="leave-balance-report-btn" class="btn-secondary" style="flex:1;">Leave Balance</button>
                </div>
                <div style="display:grid;grid-template-columns:1fr 120px;gap:10px;">
                    <div><label class="form-label">Leave Balance Year</label><input class="form-input" type="number" id="leaveBalanceYear" value="2026"></div>
                    <div><label class="form-label">Format</label><select class="form-input" id="workforceFormat"><option value="PDF">PDF</option><option value="XLSX">Excel</option></select></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 120px;gap:10px;">
                    <div><label class="form-label">Salary History Employee</label><select class="form-input" id="salaryHistoryEmployeeId"><option value="">Select employee</option></select></div>
                    <div><label class="form-label">Format</label><select class="form-input" id="salaryHistoryFormat"><option value="PDF">PDF</option><option value="XLSX">Excel</option></select></div>
                </div>
                <button id="salary-history-report-btn" class="btn-secondary">Salary History Report</button>
            </div>
        </div>
    </div>

    <!-- Audit Trail Export -->
    <div class="card" style="padding:22px;margin-top:16px;">
        <h2 style="margin:0 0 14px;font-size:18px;">Audit Trail Export</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr 120px auto;gap:10px;align-items:end;">
            <div><label class="form-label">From</label><input class="form-input" type="date" id="auditFrom" value="2026-01-01"></div>
            <div><label class="form-label">To</label><input class="form-input" type="date" id="auditTo" value="2026-12-31"></div>
            <div><label class="form-label">Format</label><select class="form-input" id="auditFormat"><option value="PDF">PDF</option><option value="XLSX">Excel</option></select></div>
            <button id="audit-report-btn" class="btn-primary">Download Audit Trail</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const userRole = MaestroHR.userRole;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatCurrency(amountKobo) {
            const naira = (amountKobo || 0) / 100;
            return '₦' + naira.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function loadReportsStats() {
            try {
                const response = await apiCall('/api/reports/stats');
                const result = await response.json();
                if (result.success && result.data) {
                    document.getElementById('stats-employees').textContent = result.data.employees || 0;
                    document.getElementById('stats-departments').textContent = result.data.departments || 0;
                    document.getElementById('stats-pending-leave').textContent = result.data.pendingLeave || 0;
                }
            } catch (error) {
                console.error('Failed to load reports stats:', error);
            }
        }

        async function loadEmployeeDropdowns() {
            try {
                const response = await apiCall('/api/employees?size=100');
                const result = await response.json();
                const employees = result.data?.content || [];
                const payslipSelect = document.getElementById('payslipEmployeeId');
                const salarySelect = document.getElementById('salaryHistoryEmployeeId');
                const options = employees.map(emp =>
                    `<option value="${emp.id}">${escapeHtml(emp.fullName || emp.firstName + ' ' + emp.lastName)} (${emp.employeeNumber})</option>`
                ).join('');
                if (payslipSelect) payslipSelect.innerHTML = '<option value="">Select employee</option>' + options;
                if (salarySelect) salarySelect.innerHTML = '<option value="">Select employee</option>' + options;
            } catch (error) {
                console.error('Failed to load employees:', error);
            }
        }

        async function loadRecentPayrollRuns() {
            const container = document.getElementById('recent-payroll-runs');
            if (!container) return;
            container.innerHTML = '<div class="text-center py-4 text-gray-500">Loading...</div>';
            try {
                const response = await apiCall('/api/payroll');
                const result = await response.json();
                if (!result.success || !result.data || result.data.length === 0) {
                    container.innerHTML = '<div class="text-center py-4 text-gray-500">No payroll runs found.</div>';
                    return;
                }
                const recentRuns = result.data.slice(0, 3);
                container.innerHTML = recentRuns.map(run => `
                    <div class="border rounded-lg p-3 flex justify-between items-center">
                        <div>
                            <p class="font-medium">${escapeHtml(run.period)}</p>
                            <p class="text-sm text-gray-500">Net: ${formatCurrency(run.totalNet)}</p>
                        </div>
                        <a href="/htmx/payroll-detail?id=${run.id}" class="btn-secondary text-sm">Open</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load recent payroll runs:', error);
                container.innerHTML = '<div class="text-center py-4 text-red-500">Failed to load.</div>';
            }
        }

        async function downloadReport(url) {
            try {
                const response = await apiCall(url);
                if (!response.ok) {
                    let message = 'Report download failed.';
                    try {
                        const data = await response.json();
                        message = data.error || data.message || message;
                    } catch (error) {}
                    showToast(message, 'error');
                    return;
                }
                const blob = await response.blob();
                const link = document.createElement('a');
                const disposition = response.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename="?([^"]+)"?/);
                link.href = URL.createObjectURL(blob);
                link.download = match ? match[1] : 'report';
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(link.href);
                showToast('Report downloaded.', 'success');
            } catch (error) {
                showToast('Failed to download report', 'error');
            }
        }

        const now = new Date();
        document.getElementById('reportMonth').value = now.getMonth() + 1;
        document.getElementById('reportYear').value = now.getFullYear();
        document.getElementById('leaveBalanceYear').value = now.getFullYear();

        // Payroll schedule reports
        document.querySelectorAll('.report-btn').forEach(button => {
            button.addEventListener('click', () => {
                const month = document.getElementById('reportMonth').value;
                const year = document.getElementById('reportYear').value;
                const format = document.getElementById('reportFormat').value;
                downloadReport(`/api/reports/${button.dataset.report}?month=${month}&year=${year}&format=${format}`);
            });
        });

        // Headcount report
        document.getElementById('headcount-report-btn').addEventListener('click', () => {
            const format = document.getElementById('workforceFormat').value;
            downloadReport(`/api/reports/employee-headcount?format=${format}`);
        });

        // Leave balance report
        document.getElementById('leave-balance-report-btn').addEventListener('click', () => {
            const year = document.getElementById('leaveBalanceYear').value;
            const format = document.getElementById('workforceFormat').value;
            downloadReport(`/api/reports/leave-balance?year=${year}&format=${format}`);
        });

        // PenCom Pension Report (XML only – no format parameter, direct redirect)
        const pencomBtn = document.getElementById('pencom-report-btn');
        if (pencomBtn) {
            pencomBtn.addEventListener('click', () => {
                const month = document.getElementById('reportMonth').value;
                const year = document.getElementById('reportYear').value;
                if (!month || !year) {
                    showToast('Please select month and year', 'error');
                    return;
                }
                window.location.href = `/api/reports/pencom-report?month=${month}&year=${year}`;
            });
        }

        // NSITF Report (direct redirect)
        const nsitfBtn = document.getElementById('nsitf-report-btn');
        if (nsitfBtn) {
            nsitfBtn.addEventListener('click', () => {
                const month = document.getElementById('reportMonth').value;
                const year = document.getElementById('reportYear').value;
                if (!month || !year) {
                    showToast('Please select month and year', 'error');
                    return;
                }
                window.location.href = `/api/reports/nsitf-report?month=${month}&year=${year}`;
            });
        }

        // Salary history report
        document.getElementById('salary-history-report-btn').addEventListener('click', () => {
            const employeeId = document.getElementById('salaryHistoryEmployeeId').value;
            const format = document.getElementById('salaryHistoryFormat').value;
            if (!employeeId) {
                showToast('Select an employee first.', 'error');
                return;
            }
            downloadReport(`/api/reports/salary-history?employeeId=${employeeId}&format=${format}`);
        });

        // Audit trail report
        document.getElementById('audit-report-btn').addEventListener('click', () => {
            const fromDate = document.getElementById('auditFrom').value;
            const toDate = document.getElementById('auditTo').value;
            const format = document.getElementById('auditFormat').value;
            if (!fromDate || !toDate) {
                showToast('Select both audit dates.', 'error');
                return;
            }
            downloadReport(`/api/reports/audit-trail?from=${fromDate}&to=${toDate}&format=${format}`);
        });

        // Download payslip – uses direct redirect (original behaviour)
        const payslipBtn = document.getElementById('download-payslip-btn');
        if (payslipBtn) {
            payslipBtn.addEventListener('click', (event) => {
                event.preventDefault();
                const employeeId = document.getElementById('payslipEmployeeId').value;
                if (!employeeId) {
                    showToast('Select an employee first.', 'error');
                    return;
                }
                window.location.href = `/api/reports/payslip?employeeId=${employeeId}`;
            });
        }

        loadReportsStats();
        loadEmployeeDropdowns();
        loadRecentPayrollRuns();
    })();
</script>
