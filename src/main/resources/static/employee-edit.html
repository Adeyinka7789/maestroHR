<!-- employee-edit.html – content partial only -->
<style>
    /* Page‑specific styles (not in layout.css) */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 19px; font-weight: 600; color: #111827; }
    .page-subtitle { font-size: 13px; color: #6b7280; margin-top: 2px; }
</style>

<div id="edit-employee-content" style="display:none;">
    <div class="page-header">
        <div style="display:flex;align-items:center;gap:10px;">
            <a id="back-link" href="#" style="color:#6b7280;text-decoration:none;display:flex;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <div>
                <h1 id="employee-name-header" class="page-title">Edit Employee</h1>
                <p id="employee-number-header" class="page-subtitle">EMP-001</p>
            </div>
        </div>
    </div>

    <div id="form-error" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:20px;color:#991b1b;font-size:13.5px;"></div>

    <input type="hidden" id="employeeId">

    <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- Personal Information -->
        <div class="card" style="padding:24px;">
            <h2 style="font-size:14px;font-weight:600;color:#111827;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid #f3f4f6;">Personal Information</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                <div><label class="form-label">First Name *</label><input class="form-input" type="text" id="firstName" required></div>
                <div><label class="form-label">Last Name *</label><input class="form-input" type="text" id="lastName" required></div>
                <div><label class="form-label">Work Email *</label><input class="form-input" type="email" id="email" required></div>
                <div><label class="form-label">Phone *</label><input class="form-input" type="tel" id="phone" required></div>
                <div><label class="form-label">Date of Birth *</label><input class="form-input" type="date" id="dateOfBirth" required></div>
                <div>
                    <label class="form-label">Gender *</label>
                    <select class="form-input" id="gender" required>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Marital Status *</label>
                    <select class="form-input" id="maritalStatus" required>
                        <option value="SINGLE">Single</option>
                        <option value="MARRIED">Married</option>
                        <option value="DIVORCED">Divorced</option>
                        <option value="WIDOWED">Widowed</option>
                    </select>
                </div>
                <div style="grid-column:span 2;"><label class="form-label">Residential Address *</label><input class="form-input" type="text" id="address" required></div>
            </div>
        </div>

        <!-- Employment Details -->
        <div class="card" style="padding:24px;">
            <h2 style="font-size:14px;font-weight:600;color:#111827;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid #f3f4f6;">Employment Details</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                <div><label class="form-label">Employee Number *</label><input class="form-input" type="text" id="employeeNumber" required disabled style="background:#f1f5f9;"></div>
                <div><label class="form-label">Job Title *</label><input class="form-input" type="text" id="jobTitle" required></div>
                <div>
                    <label class="form-label">Employment Type *</label>
                    <select class="form-input" id="employmentType" required>
                        <option value="FULL_TIME">Full-time</option>
                        <option value="PART_TIME">Part-time</option>
                        <option value="CONTRACT">Contract</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">System Role *</label>
                    <select class="form-input" id="role" required>
                        <option value="">Select role</option>
                        <option value="EMPLOYEE">Employee</option>
                        <option value="FINANCE_OFFICER">Finance Officer</option>
                        <option value="DEPT_MANAGER">Department Manager</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Department *</label>
                    <select class="form-input" id="departmentId" required>
                        <option value="">Loading departments...</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Pay Grade *</label>
                    <select class="form-input" id="payGradeId" required>
                        <option value="">Loading pay grades...</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Shift</label>
                    <select class="form-input" id="shiftId">
                        <option value="">Loading shifts...</option>
                    </select>
                </div>
                <div><label class="form-label">Start Date *</label><input class="form-input" type="date" id="employmentStartDate" required></div>
                <div><label class="form-label">Probation End Date</label><input class="form-input" type="date" id="probationEndDate"></div>
            </div>
        </div>

        <!-- Bank Details -->
        <div class="card" style="padding:24px;">
            <h2 style="font-size:14px;font-weight:600;color:#111827;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid #f3f4f6;">Bank Details</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                <div><label class="form-label">Bank Name *</label><input class="form-input" type="text" id="bankName" required></div>
                <div><label class="form-label">Account Number *</label><input class="form-input" type="text" id="bankAccountNumber" maxlength="10" required></div>
                <div><label class="form-label">Account Name *</label><input class="form-input" type="text" id="bankAccountName" required></div>
            </div>
        </div>

        <!-- Submit -->
        <div style="display:flex;justify-content:flex-end;gap:10px;padding-bottom:8px;">
            <a id="cancel-link" href="#" class="btn-secondary">Cancel</a>
            <button type="button" id="submit-btn" class="btn-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                <span id="submit-text">Save Changes</span>
            </button>
        </div>
    </div>
</div>

<div id="loading-message" class="text-center py-12 text-gray-500">Loading employee data...</div>
<div id="error-message" class="text-center py-12 text-red-500" style="display:none;"></div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        // Get employee ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const employeeId = urlParams.get('id');

        if (!employeeId) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').textContent = 'No employee ID provided.';
            return;
        }

        let selectedDepartmentId = null;
        let selectedPayGradeId = null;
        let selectedShiftId = null;

        async function loadEmployeeData() {
            try {
                const response = await apiCall(`/api/employees/${employeeId}`);
                const result = await response.json();
                if (result.success && result.data) {
                    displayEmployeeData(result.data);
                    document.getElementById('loading-message').style.display = 'none';
                    document.getElementById('edit-employee-content').style.display = 'block';
                } else {
                    throw new Error(result.message || 'Failed to load employee');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').textContent = 'Failed to load employee data.';
            }
        }

        function displayEmployeeData(emp) {
            document.getElementById('employeeId').value = emp.id;
            document.getElementById('employee-name-header').textContent = `Edit - ${emp.firstName || ''} ${emp.lastName || ''}`;
            document.getElementById('employee-number-header').textContent = emp.employeeNumber || '';

            // Back and cancel links – use HTMX routes
            const backLink = `/htmx/employee-view?id=${emp.id}`;
            document.getElementById('back-link').setAttribute('hx-get', backLink);
            document.getElementById('back-link').setAttribute('hx-target', '#page-content');
            document.getElementById('back-link').setAttribute('hx-swap', 'innerHTML');
            document.getElementById('back-link').setAttribute('hx-push-url', 'true');
            htmx.process(document.getElementById('back-link'));
            document.getElementById('cancel-link').href = backLink;

            // Personal info
            document.getElementById('firstName').value = emp.firstName || '';
            document.getElementById('lastName').value = emp.lastName || '';
            document.getElementById('email').value = emp.email || '';
            document.getElementById('phone').value = emp.phone || '';
            document.getElementById('dateOfBirth').value = emp.dateOfBirth || '';
            document.getElementById('gender').value = emp.gender || 'MALE';
            document.getElementById('maritalStatus').value = emp.maritalStatus || 'SINGLE';
            document.getElementById('address').value = emp.address || '';

            // Employment info
            document.getElementById('employeeNumber').value = emp.employeeNumber || '';
            document.getElementById('jobTitle').value = emp.jobTitle || '';
            document.getElementById('employmentType').value = emp.employmentType || 'FULL_TIME';
            document.getElementById('employmentStartDate').value = emp.employmentStartDate || '';
            document.getElementById('probationEndDate').value = emp.probationEndDate || '';

            // Bank info
            document.getElementById('bankName').value = emp.bankName || '';
            document.getElementById('bankAccountNumber').value = emp.bankAccountNumber || '';
            document.getElementById('bankAccountName').value = emp.bankAccountName || '';
            document.getElementById('role').value = emp.userRole || 'EMPLOYEE';

            // Store IDs for later selection
            if (emp.department) selectedDepartmentId = emp.department.id;
            if (emp.payGrade) selectedPayGradeId = emp.payGrade.id;
            selectedShiftId = emp.shiftId || null;
        }

        async function loadDepartments() {
            try {
                const response = await apiCall('/api/departments');
                const result = await response.json();
                if (result.success && result.data) {
                    const select = document.getElementById('departmentId');
                    let options = '<option value="">Select department</option>';
                    result.data.forEach(dept => {
                        const selected = (selectedDepartmentId === dept.id) ? 'selected' : '';
                        options += `<option value="${dept.id}" ${selected}>${escapeHtml(dept.name)}</option>`;
                    });
                    select.innerHTML = options;
                }
            } catch (error) {
                console.error('Failed to load departments:', error);
            }
        }

        async function loadPayGrades() {
            try {
                const response = await apiCall('/api/pay-grades');
                const result = await response.json();
                if (result.success && result.data) {
                    const select = document.getElementById('payGradeId');
                    let options = '<option value="">Select pay grade</option>';
                    result.data.forEach(grade => {
                        const selected = (selectedPayGradeId === grade.id) ? 'selected' : '';
                        const salaryNgn = (grade.basicSalary || 0) / 100;
                        options += `<option value="${grade.id}" ${selected}>${escapeHtml(grade.name)} — ₦${salaryNgn.toLocaleString()}</option>`;
                    });
                    select.innerHTML = options;
                }
            } catch (error) {
                console.error('Failed to load pay grades:', error);
            }
        }

        async function loadShifts() {
            try {
                const response = await apiCall('/api/shifts');
                const result = await response.json();
                if (result.success && result.data) {
                    const select = document.getElementById('shiftId');
                    let options = '<option value="">No shift assigned</option>';
                    result.data.forEach(shift => {
                        const selected = (selectedShiftId === shift.id) ? 'selected' : '';
                        options += `<option value="${shift.id}" ${selected}>${escapeHtml(shift.name)} (${shift.startTime.slice(0,5)}–${shift.endTime.slice(0,5)})</option>`;
                    });
                    select.innerHTML = options;
                }
            } catch (error) {
                console.error('Failed to load shifts:', error);
            }
        }

        // Submit update
        const submitBtn = document.getElementById('submit-btn');
        const submitText = document.getElementById('submit-text');

        submitBtn.addEventListener('click', async () => {
            const errorBox = document.getElementById('form-error');
            errorBox.style.display = 'none';

            const requiredFields = ['firstName', 'lastName', 'email', 'phone', 'dateOfBirth', 'gender', 'maritalStatus',
                                    'address', 'jobTitle', 'employmentType', 'role', 'departmentId', 'payGradeId',
                                    'employmentStartDate', 'bankName', 'bankAccountNumber', 'bankAccountName'];

            let valid = true;
            requiredFields.forEach(id => {
                const el = document.getElementById(id);
                const val = el?.value?.trim();
                if (!val) {
                    el.style.borderColor = '#ef4444';
                    valid = false;
                } else {
                    el.style.borderColor = '';
                }
            });

            if (!valid) {
                errorBox.textContent = 'Please fill in all required fields.';
                errorBox.style.display = 'block';
                return;
            }

            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                dateOfBirth: document.getElementById('dateOfBirth').value,
                gender: document.getElementById('gender').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                address: document.getElementById('address').value.trim(),
                jobTitle: document.getElementById('jobTitle').value.trim(),
                employmentType: document.getElementById('employmentType').value,
                role: document.getElementById('role').value,
                departmentId: document.getElementById('departmentId').value,
                payGradeId: document.getElementById('payGradeId').value,
                shiftId: document.getElementById('shiftId').value || null,
                employmentStartDate: document.getElementById('employmentStartDate').value,
                probationEndDate: document.getElementById('probationEndDate').value || null,
                bankName: document.getElementById('bankName').value.trim(),
                bankAccountNumber: document.getElementById('bankAccountNumber').value.trim(),
                bankAccountName: document.getElementById('bankAccountName').value.trim()
            };

            submitBtn.disabled = true;
            submitText.textContent = 'Saving…';

            try {
                const response = await apiCall(`/api/employees/${employeeId}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    errorBox.textContent = data.message || data.error || 'Update failed.';
                    errorBox.style.display = 'block';
                    return;
                }

                showToast('Employee updated successfully!', 'success');
                setTimeout(() => {
                    htmx.ajax('GET', `/htmx/employee-view?id=${employeeId}`, {target: '#page-content', swap: 'innerHTML'});
                    history.pushState({}, '', `/htmx/employee-view?id=${employeeId}`);
                }, 800);
            } catch (e) {
                errorBox.textContent = 'Network error. Please try again.';
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Save Changes';
            }
        });

        // Load data
        loadEmployeeData();
        loadDepartments();
        loadPayGrades();
        loadShifts();
    })();
</script>
