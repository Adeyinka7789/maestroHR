<!-- discounts.html – SUPER_ADMIN discount manager (content partial only) -->
<style>
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 19px; font-weight: 600; color: #0b1c30; }
    .page-subtitle { font-size: 13px; color: #444651; margin-top: 2px; }
    .disc-btn { background: #00236f; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }
    .disc-btn:hover { background: rgba(0,35,111,.9); }
    .disc-btn.secondary { background: #eff4ff; color: #444651; border: 1px solid #c5c5d3; }
    .disc-btn.danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .disc-table { width: 100%; border-collapse: collapse; }
    .disc-table th { text-align: left; padding: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; border-bottom: 2px solid #e2e8f0; }
    .disc-table td { padding: 14px 12px; font-size: 14px; border-bottom: 1px solid #eef2f7; vertical-align: top; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
    .pill.on { background: #dcfce7; color: #166534; }
    .pill.off { background: #f1f5f9; color: #64748b; }
    .value-tag { font-weight: 700; color: #00236f; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 28px; }
    .modal-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 9px 12px; border: 1px solid #c5c5d3; border-radius: 8px; font-size: 14px; }
    .field .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
</style>

<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Discounts</h1>
            <p class="page-subtitle">Grant automatic discounts to all customers or to a specific customer, plan, and billing period.</p>
        </div>
        <button id="addBtn" class="disc-btn">+ New Discount</button>
    </div>

    <div class="card" style="padding: 20px;">
        <div class="overflow-x-auto">
            <table class="disc-table">
                <thead>
                <tr>
                    <th>Label</th>
                    <th>Value</th>
                    <th>Applies to</th>
                    <th>Window</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="discount-rows">
                <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:28px;">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create / Edit modal -->
<div id="discModal" class="modal-overlay">
    <div class="modal-card">
        <h2 id="modalTitle">New Discount</h2>
        <input type="hidden" id="f-id">

        <div class="field">
            <label for="f-label">Label</label>
            <input type="text" id="f-label" placeholder="e.g. Launch promo – 20% off" maxlength="120">
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="f-type">Type</label>
                <select id="f-type">
                    <option value="PERCENTAGE">Percentage (%)</option>
                    <option value="FIXED">Fixed amount (₦)</option>
                </select>
            </div>
            <div class="field">
                <label for="f-value" id="f-value-label">Percentage off (%)</label>
                <input type="number" id="f-value" min="0" step="1" placeholder="20">
                <div class="hint" id="f-value-hint">Between 0 and 100.</div>
            </div>
        </div>

        <div class="field">
            <label for="f-tenant">Customer</label>
            <select id="f-tenant"><option value="">All customers</option></select>
            <div class="hint">Pick a company for a special per-customer deal, or leave as “All customers”.</div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="f-plan">Plan</label>
                <select id="f-plan">
                    <option value="">All plans</option>
                    <option value="BASIC">Basic</option>
                    <option value="PROFESSIONAL">Professional</option>
                    <option value="ENTERPRISE">Enterprise</option>
                </select>
            </div>
            <div class="field">
                <label for="f-period">Billing period</label>
                <select id="f-period">
                    <option value="">All periods</option>
                    <option value="MONTHLY">Monthly</option>
                    <option value="QUARTERLY">Quarterly</option>
                    <option value="ANNUALLY">Annually</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="f-start">Starts (optional)</label>
                <input type="date" id="f-start">
            </div>
            <div class="field">
                <label for="f-end">Ends (optional)</label>
                <input type="date" id="f-end">
            </div>
        </div>

        <div class="field">
            <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
                <input type="checkbox" id="f-active" checked style="width:auto;"> Active
            </label>
        </div>

        <div class="modal-actions">
            <button id="cancelBtn" class="disc-btn secondary">Cancel</button>
            <button id="saveBtn" class="disc-btn">Save Discount</button>
        </div>
    </div>
</div>

<script>
    (function () {
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        const modal = document.getElementById('discModal');
        const fmtNaira = (kobo) => '₦' + ((kobo || 0) / 100).toLocaleString('en-NG');

        function valueText(d) {
            return d.discountType === 'PERCENTAGE'
                ? `<span class="value-tag">${d.percent}% off</span>`
                : `<span class="value-tag">₦${(d.amountNaira || 0).toLocaleString('en-NG')} off</span>`;
        }

        function appliesText(d) {
            const parts = [];
            parts.push(escapeHtml(d.companyName || 'All customers'));
            parts.push(d.planName ? titleCase(d.planName) : 'All plans');
            parts.push(d.period ? titleCase(d.period) : 'All periods');
            return parts.join(' · ');
        }

        function windowText(d) {
            if (!d.startDate && !d.endDate) return 'Always';
            return `${d.startDate || '…'} → ${d.endDate || '…'}`;
        }

        function titleCase(s) {
            return s ? s.charAt(0) + s.slice(1).toLowerCase() : s;
        }

        async function loadTenants() {
            try {
                const res = await apiCall('/api/admin/discounts/tenants');
                const body = await res.json();
                const sel = document.getElementById('f-tenant');
                (body.data || []).forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.companyName;
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.error('Failed to load customers', e);
            }
        }

        async function loadDiscounts() {
            const tbody = document.getElementById('discount-rows');
            try {
                const res = await apiCall('/api/admin/discounts');
                const body = await res.json();
                const list = body.data || [];
                if (!list.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:28px;">No discounts yet. Create one to get started.</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(d => `
                    <tr>
                        <td style="font-weight:600;">${escapeHtml(d.label || '')}</td>
                        <td>${valueText(d)}</td>
                        <td style="color:#475569;">${appliesText(d)}</td>
                        <td style="color:#475569;">${windowText(d)}</td>
                        <td><span class="pill ${d.isActive ? 'on' : 'off'}">${d.isActive ? 'Active' : 'Inactive'}</span></td>
                        <td style="white-space:nowrap; text-align:right;">
                            <button class="disc-btn secondary" data-act="edit" data-id="${d.id}" style="padding:6px 12px;">Edit</button>
                            <button class="disc-btn secondary" data-act="toggle" data-id="${d.id}" data-active="${d.isActive}" style="padding:6px 12px;">${d.isActive ? 'Disable' : 'Enable'}</button>
                            <button class="disc-btn danger" data-act="delete" data-id="${d.id}" style="padding:6px 12px;">Delete</button>
                        </td>
                    </tr>`).join('');
            } catch (e) {
                console.error('Failed to load discounts', e);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef4444; padding:28px;">Could not load discounts.</td></tr>';
            }
        }

        // Keep the value label/hint in sync with the selected type.
        function syncTypeUI() {
            const type = document.getElementById('f-type').value;
            const label = document.getElementById('f-value-label');
            const hint = document.getElementById('f-value-hint');
            if (type === 'PERCENTAGE') {
                label.textContent = 'Percentage off (%)';
                hint.textContent = 'Between 0 and 100.';
            } else {
                label.textContent = 'Amount off (₦)';
                hint.textContent = 'Flat naira amount taken off the price.';
            }
        }

        function openModal(d) {
            document.getElementById('modalTitle').textContent = d ? 'Edit Discount' : 'New Discount';
            document.getElementById('f-id').value = d ? d.id : '';
            document.getElementById('f-label').value = d ? (d.label || '') : '';
            document.getElementById('f-type').value = d ? d.discountType : 'PERCENTAGE';
            document.getElementById('f-value').value = d ? (d.discountType === 'PERCENTAGE' ? d.percent : d.amountNaira) : '';
            document.getElementById('f-tenant').value = d && d.tenantId ? d.tenantId : '';
            document.getElementById('f-plan').value = d && d.planName ? d.planName : '';
            document.getElementById('f-period').value = d && d.period ? d.period : '';
            document.getElementById('f-start').value = d && d.startDate ? d.startDate : '';
            document.getElementById('f-end').value = d && d.endDate ? d.endDate : '';
            document.getElementById('f-active').checked = d ? !!d.isActive : true;
            syncTypeUI();
            modal.classList.add('open');
        }

        function closeModal() { modal.classList.remove('open'); }

        async function save() {
            const type = document.getElementById('f-type').value;
            const value = parseFloat(document.getElementById('f-value').value);
            const payload = {
                label: document.getElementById('f-label').value.trim(),
                discountType: type,
                percent: type === 'PERCENTAGE' ? value : null,
                amountNaira: type === 'FIXED' ? value : null,
                tenantId: document.getElementById('f-tenant').value || null,
                planName: document.getElementById('f-plan').value || null,
                period: document.getElementById('f-period').value || null,
                startDate: document.getElementById('f-start').value || null,
                endDate: document.getElementById('f-end').value || null,
                isActive: document.getElementById('f-active').checked
            };

            if (!payload.label) { showToast('Label is required', 'error'); return; }
            if (!value || value <= 0) { showToast('Enter a value greater than 0', 'error'); return; }
            if (type === 'PERCENTAGE' && value > 100) { showToast('Percentage cannot exceed 100', 'error'); return; }

            const id = document.getElementById('f-id').value;
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
            try {
                const res = await apiCall(id ? `/api/admin/discounts/${id}` : '/api/admin/discounts', {
                    method: id ? 'PUT' : 'POST',
                    body: JSON.stringify(payload)
                });
                const body = await res.json();
                if (res.ok && body.success) {
                    showToast(id ? 'Discount updated' : 'Discount created', 'success');
                    closeModal();
                    loadDiscounts();
                } else {
                    showToast(body.message || 'Could not save discount', 'error');
                }
            } catch (e) {
                console.error(e);
                showToast('Could not save discount', 'error');
            } finally {
                saveBtn.disabled = false; saveBtn.textContent = 'Save Discount';
            }
        }

        async function toggle(id, currentlyActive) {
            try {
                await apiCall(`/api/admin/discounts/${id}/toggle?active=${!currentlyActive}`, { method: 'POST' });
                loadDiscounts();
            } catch (e) { showToast('Could not update status', 'error'); }
        }

        async function remove(id) {
            if (!confirm('Delete this discount? This cannot be undone.')) return;
            try {
                await apiCall(`/api/admin/discounts/${id}`, { method: 'DELETE' });
                showToast('Discount deleted', 'success');
                loadDiscounts();
            } catch (e) { showToast('Could not delete discount', 'error'); }
        }

        // Row action delegation (rows are re-rendered, so bind on the tbody).
        document.getElementById('discount-rows').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const id = btn.dataset.id;
            const act = btn.dataset.act;
            if (act === 'delete') return remove(id);
            if (act === 'toggle') return toggle(id, btn.dataset.active === 'true');
            if (act === 'edit') {
                const res = await apiCall('/api/admin/discounts');
                const body = await res.json();
                const d = (body.data || []).find(x => x.id === id);
                if (d) openModal(d);
            }
        });

        document.getElementById('addBtn').addEventListener('click', () => openModal(null));
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', save);
        document.getElementById('f-type').addEventListener('change', syncTypeUI);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        loadTenants();
        loadDiscounts();
    })();
</script>
