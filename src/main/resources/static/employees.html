<!-- employees.html – content partial only -->
<!-- No DOCTYPE, <html>, <head>, sidebar, topbar, toast container – all provided by layout.html -->
<style>
    /* Page-specific styles – only what's not already in layout.css */
    /* Most of the original styles are already in layout.css; keep only if needed */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-title { font-size: 19px; font-weight: 600; color: #111827; }
    .page-subtitle { font-size: 13px; color: #6b7280; margin-top: 2px; }
</style>

<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Employees</h1>
            <p id="record-count" class="page-subtitle">Loading…</p>
        </div>
        <div style="display:flex; gap:10px;">
            <button id="import-csv-btn" class="btn-secondary">📤 Import CSV</button>
            <button id="export-excel-btn" class="btn-secondary">📊 Export to Excel</button>
            <a href="/htmx/employee-create" class="btn-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Employee
            </a>
        </div>
    </div>

    <!-- Hidden file input for CSV import -->
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;">

    <!-- Employee table -->
    <div class="card" style="overflow:hidden;">
        <table class="data-table" style="width:100%;border-collapse:collapse;">
            <thead>
            <tr style="border-bottom:1px solid #f3f4f6;background:#f9fafb;">
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">Employee</th>
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">ID</th>
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">Department</th>
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">Pay Grade</th>
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">Status</th>
                <th style="text-align:left;padding:11px 16px;font-size:11.5px;font-weight:600;color:#6b7280;text-transform:uppercase;">Basic Salary</th>
                <th style="padding:11px 16px;"></th>
            </tr>
            </thead>
            <tbody id="employees-tbody">
            <tr><td colspan="7" style="padding:56px 16px;text-align:center;color:#94a3b8;">Loading employees…</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;"></div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token       = MaestroHR.token;
        const apiCall     = MaestroHR.apiCall.bind(MaestroHR);
        const escapeHtml  = MaestroHR.escapeHtml.bind(MaestroHR);
        const showToast   = MaestroHR.showToast.bind(MaestroHR);

        // ── Employee data ──────────────────────────────────────────────
        let allEmployees = [];
        let currentPage  = 0;
        let totalPages   = 0;
        let totalCount   = 0;
        const PAGE_SIZE  = 20;

        function loadEmployees(page = 0) {
            document.getElementById('employees-tbody').innerHTML = '<tr><td colspan="7" style="padding:56px 16px;text-align:center;color:#94a3b8;">Loading…</td></tr>';

            apiCall(`/api/employees?page=${page}&size=${PAGE_SIZE}`)
                .then(res => res.json())
                .then(result => {
                    const data = result.data || result;
                    allEmployees = data.content || [];
                    currentPage  = data.number  || page;
                    totalPages   = data.totalPages   || 0;
                    totalCount   = data.totalElements || allEmployees.length;

                    document.getElementById('record-count').textContent = totalCount + ' records';
                    renderTable(allEmployees);
                    renderPagination();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('employees-tbody').innerHTML = '<tr><td colspan="7" style="padding:40px 16px;text-align:center;color:#ef4444;">Failed to load employees. Please refresh.</td></tr>';
                });
        }

        function renderTable(employees) {
            const tbody = document.getElementById('employees-tbody');
            if (!employees || employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="padding:56px 16px;text-align:center;">'
                    + '<p style="font-size:14px;font-weight:500;color:#374151;margin:0 0 4px;">No employees found</p>'
                    + '<p style="font-size:13px;color:#9ca3af;margin:0 0 16px;">Add your first employee to get started.</p>'
                    + '<a href="/htmx/employee-create" class="btn-primary" style="display:inline-flex;">Add Employee</a>'
                    + '</td></tr>';
                return;
            }

            tbody.innerHTML = employees.map(emp => {
                const initials = ((emp.firstName || '')[0] || '') + ((emp.lastName || '')[0] || '');
                const statusClass = {
                    ACTIVE: 'badge-green',
                    ON_LEAVE: 'badge-amber',
                    SUSPENDED: 'badge-red',
                    TERMINATED: 'badge-gray'
                }[emp.status] || 'badge-gray';
                const salary = emp.basicSalary ? '₦' + Math.round(emp.basicSalary / 100).toLocaleString('en-NG') : '—';

                return `<tr style="border-bottom:1px solid #f9fafb;">
                    <td style="padding:12px 16px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:34px;height:34px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#2563eb;">${escapeHtml(initials)}</div>
                            <div>
                                <p style="font-size:13.5px;font-weight:500;color:#111827;margin:0;">${escapeHtml(emp.firstName)} ${escapeHtml(emp.lastName)}</p>
                                <p style="font-size:12px;color:#6b7280;margin:2px 0 0;">${escapeHtml(emp.email)}</p>
                            </div>
                        </div>
                    </td>
                    <td style="padding:12px 16px;"><span style="font-size:12.5px;color:#374151;font-family:'DM Mono',monospace;">${escapeHtml(emp.employeeNumber || '—')}</span></td>
                    <td style="padding:12px 16px;font-size:13px;color:#374151;">${escapeHtml(emp.departmentName || '—')}</td>
                    <td style="padding:12px 16px;font-size:13px;color:#374151;">${escapeHtml(emp.payGradeName || '—')}</td>
                    <td style="padding:12px 16px;"><span class="badge ${statusClass}">${escapeHtml(emp.status || 'ACTIVE')}</span></td>
                    <td style="padding:12px 16px;font-size:13px;font-family:'DM Mono',monospace;color:#111827;">${salary}</td>
                    <td style="padding:12px 16px;text-align:right;">
                        <div style="display:flex;gap:6px;justify-content:flex-end;">
                            <a href="/htmx/employee-view?id=${emp.id}" class="btn-secondary" style="font-size:12px;padding:5px 10px;">View</a>
                            <a href="/htmx/employee-edit?id=${emp.id}" class="btn-secondary" style="font-size:12px;padding:5px 10px;">Edit</a>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <p style="font-size:13px;color:#6b7280;">Page ${currentPage + 1} of ${totalPages}</p>
                <div style="display:flex;gap:8px;">
                    <button id="prev-btn" class="btn-secondary" style="font-size:13px;padding:6px 12px;" ${currentPage === 0 ? 'disabled' : ''}>← Prev</button>
                    <button id="next-btn" class="btn-primary" style="font-size:13px;padding:6px 12px;" ${currentPage + 1 >= totalPages ? 'disabled' : ''}>Next →</button>
                </div>
            `;
            document.getElementById('prev-btn')?.addEventListener('click', () => { if (currentPage > 0) loadEmployees(currentPage - 1); });
            document.getElementById('next-btn')?.addEventListener('click', () => { if (currentPage + 1 < totalPages) loadEmployees(currentPage + 1); });
        }

        // ── Search (client‑side filter) ────────────────────────────────
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (!q) {
                    renderTable(allEmployees);
                    document.getElementById('record-count').textContent = totalCount + ' records';
                    return;
                }
                const filtered = allEmployees.filter(emp => {
                    const fullName = `${emp.firstName || ''} ${emp.lastName || ''}`.toLowerCase();
                    const email = (emp.email || '').toLowerCase();
                    const empNum = (emp.employeeNumber || '').toLowerCase();
                    const dept = (emp.departmentName || '').toLowerCase();
                    return fullName.includes(q) || email.includes(q) || empNum.includes(q) || dept.includes(q);
                });
                renderTable(filtered);
                document.getElementById('record-count').textContent = filtered.length + ' of ' + totalCount + ' records';
            });
        }

        // ── Import / Export ───────────────────────────────────────────
        document.getElementById('export-excel-btn')?.addEventListener('click', () => {
            window.location.href = '/api/employees/export/excel';
        });

        const csvFileInput = document.getElementById('csvFileInput');
        const importBtn = document.getElementById('import-csv-btn');
        importBtn?.addEventListener('click', () => csvFileInput.click());

        csvFileInput?.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            showToast('Importing employees...', 'info');

            try {
                const response = await fetch('/api/employees/import/csv', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    showToast(`✅ Imported ${data.successCount} employees, ${data.errorCount} errors`, 'success');
                    loadEmployees(currentPage);
                } else {
                    showToast(result.message || 'Import failed', 'error');
                }
            } catch (error) {
                console.error('Import failed:', error);
                showToast('Import failed. Check console.', 'error');
            }
            e.target.value = '';
        });

        // ── Initial load ──────────────────────────────────────────────
        loadEmployees(0);
    })();
</script>
