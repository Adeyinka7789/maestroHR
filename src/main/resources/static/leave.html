<!-- leave.html – content partial only -->
<style>
    /* Page‑specific styles if any – all shared styles are in layout.css */
</style>

<div id="leave-content">
    <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px;">
        <!-- Pending Requests Card -->
        <div class="card" style="padding:22px;">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Pending Requests</div>
            <div id="pending-count" style="font-size:32px;font-weight:600;margin-top:8px;">0</div>
            <div style="margin-top:14px;color:#64748b;font-size:13px;">Recent requests and quick actions for managers.</div>
        </div>

        <!-- Apply for Leave Card -->
        <div class="card" style="padding:22px;">
            <div style="font-size:12px;color:#64748b;text-transform:uppercase;">Apply for Leave</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
                <select id="leaveEmployeeId" class="form-input"><option value="">Employee</option></select>
                <select id="leaveTypeId" class="form-input"><option value="">Leave type</option></select>
                <input id="leaveStartDate" class="form-input" type="date" placeholder="Start Date">
                <input id="leaveEndDate" class="form-input" type="date" placeholder="End Date">
                <input id="leaveReason" class="form-input" placeholder="Reason" style="grid-column:1 / -1;">
            </div>
            <button id="leave-apply-btn" class="btn-primary" style="margin-top:12px;">Submit request</button>
        </div>
    </div>

    <!-- Leave Requests Table -->
    <div class="card" style="padding:0;overflow:hidden;">
        <div class="overflow-x-auto">
            <table class="data-table" style="width:100%;border-collapse:collapse;">
                <thead>
                <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:12px 16px;text-align:left;">Employee</th>
                    <th style="padding:12px 16px;text-align:left;">Type</th>
                    <th style="padding:12px 16px;text-align:left;">Window</th>
                    <th style="padding:12px 16px;text-align:left;">Status</th>
                    <th style="padding:12px 16px;text-align:right;"></th>
                </tr>
                </thead>
                <tbody id="leave-requests-table-body">
                <tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading leave requests...</span></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        async function loadLeaveData() {
            try {
                // Load pending count
                const pendingCountRes = await apiCall('/api/leave/requests/pending');
                const pendingCountData = await pendingCountRes.json();
                if (pendingCountData.success) {
                    document.getElementById('pending-count').textContent = pendingCountData.data?.length || 0;
                }

                // Load employees for dropdown (only active employees)
                const employeesRes = await apiCall('/api/employees');
                const employeesData = await employeesRes.json();
                if (employeesData.success && employeesData.data && employeesData.data.content) {
                    const employeeSelect = document.getElementById('leaveEmployeeId');
                    employeeSelect.innerHTML = '<option value="">Select Employee</option>' +
                        employeesData.data.content
                            .filter(emp => emp.status === 'ACTIVE')
                            .map(emp => `<option value="${emp.id}">${escapeHtml(emp.fullName || emp.firstName + ' ' + emp.lastName)} (${emp.employeeNumber})</option>`)
                            .join('');
                }

                // Load leave types for dropdown
                const typesRes = await apiCall('/api/leave/types');
                const typesData = await typesRes.json();
                if (typesData.success && typesData.data) {
                    const typeSelect = document.getElementById('leaveTypeId');
                    typeSelect.innerHTML = '<option value="">Select Leave Type</option>' +
                        typesData.data.map(type => `<option value="${type.id}">${escapeHtml(type.name)} (${type.maxDaysPerYear} days)</option>`)
                        .join('');
                }

                // Load pending leave requests (for approval table)
                const pendingRequestsRes = await apiCall('/api/leave/requests/pending');
                const pendingRequestsData = await pendingRequestsRes.json();

                const tbody = document.getElementById('leave-requests-table-body');
                if (pendingRequestsData.success && pendingRequestsData.data && pendingRequestsData.data.length > 0) {
                    tbody.innerHTML = pendingRequestsData.data.map(request => {
                        let badgeClass = 'badge-amber';
                        let statusText = request.status || 'PENDING';
                        if (statusText === 'APPROVED') badgeClass = 'badge-green';
                        else if (statusText === 'REJECTED') badgeClass = 'badge-red';
                        else if (statusText === 'PENDING') badgeClass = 'badge-amber';

                        const startDate = request.startDate ? new Date(request.startDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) : '';
                        const endDate = request.endDate ? new Date(request.endDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

                        return `
                            <tr style="border-bottom:1px solid #f8fafc;">
                                <td style="padding:14px 16px;">
                                    <div style="font-weight:500;">${escapeHtml(request.employee?.fullName || request.employeeName || 'Unknown')}</div>
                                    <div style="font-size:12px;color:#64748b;">${escapeHtml(request.reason || '')}</div>
                                 </td>
                                <td style="padding:14px 16px;">${escapeHtml(request.leaveType?.name || request.leaveTypeName || '-')}</td>
                                <td style="padding:14px 16px;">${startDate} - ${endDate}</td>
                                <td style="padding:14px 16px;"><span class="badge ${badgeClass}">${statusText}</span></td>
                                <td style="padding:14px 16px;text-align:right;">
                                    <button class="btn-secondary leave-approve-btn" data-id="${request.id}" style="font-size:12px;padding:5px 10px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;">Approve</button>
                                    <button class="btn-danger leave-reject-btn" data-id="${request.id}" style="font-size:12px;padding:5px 10px;">Reject</button>
                                </td>
                             </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">No pending leave requests.</td></tr>';
                }

                // Attach event listeners for approve/reject buttons
                document.querySelectorAll('.leave-approve-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const res = await apiCall(`/api/leave/requests/${btn.dataset.id}/approve`, { method: 'POST' });
                        const data = await res.json();
                        if (!res.ok) { showToast(data.error || data.message || 'Approval failed.', 'error'); return; }
                        showToast('Leave request approved.', 'success');
                        setTimeout(() => loadLeaveData(), 500);
                    });
                });

                document.querySelectorAll('.leave-reject-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const reason = prompt('Reason for rejection:');
                        if (!reason) return;
                        const res = await apiCall(`/api/leave/requests/${btn.dataset.id}/reject?reason=${encodeURIComponent(reason)}`, { method: 'POST' });
                        const data = await res.json();
                        if (!res.ok) { showToast(data.error || data.message || 'Rejection failed.', 'error'); return; }
                        showToast('Leave request rejected.', 'success');
                        setTimeout(() => loadLeaveData(), 500);
                    });
                });
            } catch (error) {
                console.error('Failed to load leave data:', error);
                document.getElementById('leave-requests-table-body').innerHTML = '<tr><td colspan="5" style="padding:48px 16px;text-align:center;color:#94a3b8;">Failed to load leave requests.</td></tr>';
            }
        }

        // Submit new leave request
        const applyBtn = document.getElementById('leave-apply-btn');
        if (applyBtn) {
            applyBtn.addEventListener('click', async () => {
                const employeeId = document.getElementById('leaveEmployeeId').value;
                const leaveTypeId = document.getElementById('leaveTypeId').value;
                const startDate = document.getElementById('leaveStartDate').value;
                const endDate = document.getElementById('leaveEndDate').value;
                const reason = document.getElementById('leaveReason').value.trim();

                if (!employeeId || !leaveTypeId || !startDate || !endDate || !reason) {
                    showToast('Please complete all required fields.', 'error');
                    return;
                }

                if (new Date(startDate) > new Date(endDate)) {
                    showToast('Start date cannot be after end date.', 'error');
                    return;
                }

                try {
                    const url = `/api/leave/requests?employeeId=${employeeId}&leaveTypeId=${leaveTypeId}&startDate=${startDate}&endDate=${endDate}&reason=${encodeURIComponent(reason)}`;
                    const res = await apiCall(url, { method: 'POST' });
                    const data = await res.json();
                    if (!res.ok) {
                        showToast(data.error || data.message || 'Request failed.', 'error');
                        return;
                    }
                    showToast('Leave request submitted successfully.', 'success');
                    document.getElementById('leaveStartDate').value = '';
                    document.getElementById('leaveEndDate').value = '';
                    document.getElementById('leaveReason').value = '';
                    setTimeout(() => loadLeaveData(), 500);
                } catch (error) {
                    showToast('Failed to submit request. Please try again.', 'error');
                }
            });
        }

        loadLeaveData();
    })();
</script>
