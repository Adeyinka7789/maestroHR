<!-- payroll-detail.html – content partial only -->
<style>
    /* Page‑specific styles (all shared styles are in layout.css) */
</style>

<div>
    <div class="mb-4">
        <a href="/htmx/payroll" class="text-blue-600 hover:underline flex items-center gap-1" style="text-decoration:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Payroll Runs
        </a>
    </div>

    <!-- Payroll Run Summary Card -->
    <div class="card" style="padding:24px; margin-bottom:24px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div>
                <h1 id="run-period" class="text-2xl font-bold text-gray-800">Loading...</h1>
                <p id="run-status" class="mt-1"><span class="badge badge-gray">Loading</span></p>
            </div>
            <div class="flex gap-2">
                <button id="compute-btn" class="btn-primary" style="display:none;">Compute</button>
                <button id="submit-btn" class="btn-primary" style="display:none;">Submit for Approval</button>
                <button id="approve-btn" class="btn-primary" style="display:none;">Approve</button>
                <button id="disburse-btn" class="btn-primary" style="display:none;">Disburse</button>
                <button id="reject-btn" class="btn-danger" style="display:none;">Reject</button>
                <button id="export-excel-btn" class="btn-secondary" style="display:none;">
                    📊 Export to Excel
                </button>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div><p class="text-gray-500 text-sm">Total Employees</p><p id="total-employees" class="text-xl font-semibold">—</p></div>
            <div><p class="text-gray-500 text-sm">Total Gross</p><p id="total-gross" class="text-xl font-semibold">—</p></div>
            <div><p class="text-gray-500 text-sm">Total Net</p><p id="total-net" class="text-xl font-semibold">—</p></div>
            <div><p class="text-gray-500 text-sm">Total PAYE</p><p id="total-paye" class="text-xl font-semibold">—</p></div>
        </div>
    </div>

    <!-- Entries Table -->
    <div class="card" style="overflow:hidden;">
        <div class="p-4 border-b"><h2 class="font-semibold">Employee Payroll Entries</h2></div>
        <div class="overflow-x-auto">
            <table class="data-table w-full">
                <thead>
                <tr style="background:#f8fafc;">
                    <th class="p-3 text-left">Employee</th>
                    <th class="p-3 text-left">Basic Salary</th>
                    <th class="p-3 text-left">Gross</th>
                    <th class="p-3 text-left">PAYE</th>
                    <th class="p-3 text-left">Pension</th>
                    <th class="p-3 text-left">NHF</th>
                    <th class="p-3 text-left">Net</th>
                </tr>
                </thead>
                <tbody id="entries-tbody">
                <tr><td colspan="7" class="p-8 text-center text-gray-400">Loading entries...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const userRole = MaestroHR.userRole;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatCurrency(amountKobo) {
            const naira = (amountKobo || 0) / 100;
            return '₦' + naira.toLocaleString('en-NG', { minimumFractionDigits: 2 });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const payrollRunId = urlParams.get('id');
        if (!payrollRunId) {
            window.location.href = '/htmx/payroll';
            return;
        }

        let currentRun = null;

        async function loadPayrollRun() {
            try {
                const res = await apiCall(`/api/payroll/${payrollRunId}`);
                if (!res.ok) throw new Error('Failed to load');
                const result = await res.json();
                if (!result.success) throw new Error(result.error);
                currentRun = result.data;
                displaySummary(currentRun);
                await loadEntries();
                updateActionButtons(currentRun);
            } catch (err) {
                console.error(err);
                showToast('Failed to load payroll run', 'error');
            }
        }

        function displaySummary(run) {
            document.getElementById('run-period').textContent = run.period || '—';
            const statusBadge = document.getElementById('run-status');
            let badgeClass = 'badge-gray';
            if (run.status === 'DRAFT') badgeClass = 'badge-blue';
            else if (run.status === 'PENDING_APPROVAL') badgeClass = 'badge-amber';
            else if (run.status === 'APPROVED') badgeClass = 'badge-green';
            else if (run.status === 'DISBURSING') badgeClass = 'badge-amber';
            else if (run.status === 'COMPLETED') badgeClass = 'badge-green';
            else if (run.status === 'REJECTED') badgeClass = 'badge-red';
            statusBadge.innerHTML = `<span class="badge ${badgeClass}">${run.status || 'DRAFT'}</span>`;

            document.getElementById('total-employees').textContent = run.entries?.length || 0;
            document.getElementById('total-gross').textContent = formatCurrency(run.totalGross);
            document.getElementById('total-net').textContent = formatCurrency(run.totalNet);
            document.getElementById('total-paye').textContent = formatCurrency(run.totalPaye);
        }

        async function loadEntries() {
            const tbody = document.getElementById('entries-tbody');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">Loading entries...</span></tr>';
            try {
                const res = await apiCall(`/api/payroll/${payrollRunId}/entries`);
                const result = await res.json();
                if (!result.success) throw new Error(result.error);
                const entries = result.data;
                if (!entries || entries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">No entries found.办</td></tr>';
                    return;
                }
                tbody.innerHTML = entries.map(entry => `
                    <tr class="border-b">
                        <td class="p-3">${escapeHtml(entry.employeeName)}</td>
                        <td class="p-3">${formatCurrency(entry.basicSalary)}</td>
                        <td class="p-3">${formatCurrency(entry.grossSalary)}</td>
                        <td class="p-3">${formatCurrency(entry.payeTax)}</td>
                        <td class="p-3">${formatCurrency(entry.pensionEmployee)}</td>
                        <td class="p-3">${formatCurrency(entry.nhfDeduction)}</td>
                        <td class="p-3 font-semibold">${formatCurrency(entry.netSalary)}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-red-500">Failed to load entries.</td></tr>';
            }
        }

        function updateActionButtons(run) {
            const isHr = userRole === 'HR_ADMIN' || userRole === 'SUPER_ADMIN';
            const isFinance = userRole === 'FINANCE_OFFICER' || userRole === 'SUPER_ADMIN';
            const status = run.status;
            document.getElementById('compute-btn').style.display = (status === 'DRAFT' && isHr) ? 'inline-flex' : 'none';
            document.getElementById('submit-btn').style.display = (status === 'DRAFT' && isHr) ? 'inline-flex' : 'none';
            document.getElementById('approve-btn').style.display = (status === 'PENDING_APPROVAL' && isFinance) ? 'inline-flex' : 'none';
            document.getElementById('disburse-btn').style.display = (status === 'APPROVED' && isFinance) ? 'inline-flex' : 'none';
            document.getElementById('reject-btn').style.display = (status === 'PENDING_APPROVAL' && isFinance) ? 'inline-flex' : 'none';

            const exportBtn = document.getElementById('export-excel-btn');
            if (exportBtn && (isHr || isFinance)) {
                exportBtn.style.display = 'inline-flex';
            }
        }

        async function performAction(endpoint, successMsg) {
            try {
                const res = await apiCall(`/api/payroll/${payrollRunId}/${endpoint}`, { method: 'POST' });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Action failed');
                showToast(successMsg, 'success');
                await loadPayrollRun();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        document.getElementById('compute-btn').addEventListener('click', () => performAction('compute', 'Payroll computed successfully'));
        document.getElementById('submit-btn').addEventListener('click', () => performAction('submit', 'Submitted for approval'));
        document.getElementById('approve-btn').addEventListener('click', () => performAction('approve', 'Payroll approved'));
        document.getElementById('disburse-btn').addEventListener('click', () => performAction('disburse', 'Disbursement initiated'));

        const exportBtn = document.getElementById('export-excel-btn');
        if (exportBtn) {
            exportBtn.addEventListener('click', () => {
                if (payrollRunId) {
                    window.location.href = `/api/payroll/${payrollRunId}/export-excel`;
                }
            });
        }

        const rejectBtn = document.getElementById('reject-btn');
        if (rejectBtn) {
            rejectBtn.addEventListener('click', async () => {
                const reason = prompt('Please enter rejection reason:');
                if (!reason) return;
                try {
                    const res = await apiCall(`/api/payroll/${payrollRunId}/reject?reason=${encodeURIComponent(reason)}`, { method: 'POST' });
                    const result = await res.json();
                    if (!res.ok) throw new Error(result.error || 'Rejection failed');
                    showToast('Payroll rejected', 'success');
                    await loadPayrollRun();
                } catch (err) {
                    showToast(err.message, 'error');
                }
            });
        }

        loadPayrollRun();
    })();
</script>
