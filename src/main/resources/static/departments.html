<!-- departments.html – content partial only -->
<style>
    /* Page‑specific styles (not in layout.css) */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 19px; font-weight: 600; color: #111827; }
    .page-subtitle { font-size: 13px; color: #6b7280; margin-top: 2px; }
    #department-modal .card { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; }
</style>

<div id="departments-content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Departments</h1>
            <p class="page-subtitle">Define org structure and ownership boundaries.</p>
        </div>
        <button class="btn-primary" onclick="openDepartmentModal()">New Department</button>
    </div>

    <div class="card" style="overflow:hidden;">
        <div class="overflow-x-auto">
            <table class="data-table" style="width:100%;border-collapse:collapse;">
                <thead>
                <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:12px 16px;text-align:left;">Department</th>
                    <th style="padding:12px 16px;text-align:left;">Employees</th>
                    <th style="padding:12px 16px;text-align:left;">Created</th>
                    <th style="padding:12px 16px;text-align:right;"></th>
                </tr>
                </thead>
                <tbody id="departments-table-body">
                <tr><td colspan="4" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading departments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Department Modal -->
<div id="department-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:50;align-items:center;justify-content:center;">
    <div class="card" style="width:min(480px,92vw);padding:24px;">
        <h2 style="margin:0 0 14px;font-size:18px;">Department</h2>
        <input type="hidden" id="departmentId">
        <label class="form-label" for="departmentName">Name</label>
        <input class="form-input" id="departmentName" placeholder="Engineering">
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
            <button class="btn-secondary" onclick="closeDepartmentModal()">Cancel</button>
            <button class="btn-primary" id="department-save-btn">Save</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                return new Date(dateString).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) { return '-'; }
        }

        async function loadDepartments() {
            try {
                const response = await apiCall('/api/departments');
                const result = await response.json();
                if (result.success && result.data) {
                    const departments = result.data;
                    const tbody = document.getElementById('departments-table-body');
                    if (departments.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="padding:48px 16px;text-align:center;color:#94a3b8;">No departments yet.</td></tr>';
                    } else {
                        tbody.innerHTML = departments.map(dept => `
                            <tr style="border-bottom:1px solid #f8fafc;">
                                <td style="padding:14px 16px;font-weight:500;">${escapeHtml(dept.name)}</td>
                                <td style="padding:14px 16px;">${dept.employeeCount || 0}</td>
                                <td style="padding:14px 16px;color:#64748b;">${formatDate(dept.createdAt)}</td>
                                <td style="padding:14px 16px;text-align:right;">
                                    <button class="btn-secondary dept-edit-btn" data-id="${dept.id}" data-name="${escapeHtml(dept.name)}" style="font-size:12px;padding:5px 10px;">Edit</button>
                                </td>
                            </tr>
                        `).join('');
                    }
                    // Re-attach edit event handlers
                    document.querySelectorAll('.dept-edit-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.getElementById('departmentId').value = btn.dataset.id;
                            document.getElementById('departmentName').value = btn.dataset.name;
                            document.getElementById('department-modal').style.display = 'flex';
                        });
                    });
                } else {
                    throw new Error('Failed to load departments');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('departments-table-body').innerHTML = '<tr><td colspan="4" style="padding:48px 16px;text-align:center;color:#94a3b8;">Failed to load departments.</td></tr>';
            }
        }

        window.openDepartmentModal = function() {
            document.getElementById('departmentId').value = '';
            document.getElementById('departmentName').value = '';
            document.getElementById('department-modal').style.display = 'flex';
        };

        window.closeDepartmentModal = function() {
            document.getElementById('department-modal').style.display = 'none';
        };

        document.getElementById('department-save-btn').addEventListener('click', async () => {
            const id = document.getElementById('departmentId').value;
            const name = document.getElementById('departmentName').value.trim();
            if (!name) {
                showToast('Department name is required.', 'error');
                return;
            }
            try {
                const url = id ? `/api/departments/${id}` : '/api/departments';
                const method = id ? 'PUT' : 'POST';
                const response = await apiCall(url, {
                    method: method,
                    body: JSON.stringify({ name: name })
                });
                const result = await response.json();
                if (!response.ok) {
                    showToast(result.error || result.message || 'Save failed.', 'error');
                    return;
                }
                showToast('Department saved.', 'success');
                closeDepartmentModal();
                loadDepartments();
            } catch (error) {
                showToast('Failed to save department.', 'error');
            }
        });

        // Close modal when clicking outside
        const modal = document.getElementById('department-modal');
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeDepartmentModal();
        });

        loadDepartments();
    })();
</script>
