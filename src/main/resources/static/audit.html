<!-- audit.html – content partial only -->
<style>
    /* Page‑specific styles (not in layout.css) */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 19px; font-weight: 600; color: #111827; }
    .page-subtitle { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .status-2xx { color: #166534; background: #dcfce7; }
</style>

<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Audit Logs</h1>
            <p class="page-subtitle">Track all system activities and user actions</p>
        </div>
        <button id="refresh-btn" class="btn-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Refresh
        </button>
    </div>

    <!-- Filters -->
    <div class="card" style="padding:20px; margin-bottom:24px;">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div><label class="form-label">Action Filter</label><select id="action-filter" class="form-input"><option value="">All Actions</option></select></div>
            <div><label class="form-label">Entity Type</label><select id="entity-type-filter" class="form-input"><option value="">All Types</option></select></div>
            <div><label class="form-label">Actor Email</label><input type="text" id="actor-filter" class="form-input" placeholder="Search by email..."></div>
            <div><label class="form-label">Status Code</label><select id="status-filter" class="form-input"><option value="">All Status</option><option value="2xx">2xx - Success</option><option value="3xx">3xx - Redirection</option><option value="4xx">4xx - Client Error</option><option value="5xx">5xx - Server Error</option></select></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div><label class="form-label">Date From</label><input type="datetime-local" id="date-from" class="form-input"></div>
            <div><label class="form-label">Date To</label><input type="datetime-local" id="date-to" class="form-input"></div>
        </div>
        <div class="flex gap-3 mt-4">
            <button id="apply-filters" class="btn-primary">Apply Filters</button>
            <button id="clear-filters" class="btn-secondary">Clear Filters</button>
        </div>
    </div>

    <!-- Audit Logs Table -->
    <div class="card" style="overflow:hidden;">
        <div class="overflow-x-auto">
            <table class="data-table" style="width:100%;border-collapse:collapse;">
                <thead>
                <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:12px 16px;text-align:left;">Timestamp</th>
                    <th style="padding:12px 16px;text-align:left;">Actor</th>
                    <th style="padding:12px 16px;text-align:left;">Action</th>
                    <th style="padding:12px 16px;text-align:left;">Entity</th>
                    <th style="padding:12px 16px;text-align:left;">Status</th>
                    <th style="padding:12px 16px;text-align:left;">Details</th>
                </tr>
                </thead>
                <tbody id="audit-table-body">
                <tr><td colspan="6" style="padding:48px 16px;text-align:center;color:#94a3b8;">Loading audit logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;"></div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                return new Date(dateStr).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
            } catch(e) { return '-'; }
        }

        function getStatusBadge(statusCode) {
            let cls = 'badge-gray';
            if (statusCode >= 200 && statusCode < 300) cls = 'badge-green';
            else if (statusCode >= 300 && statusCode < 400) cls = 'badge-amber';
            else if (statusCode >= 400 && statusCode < 600) cls = 'badge-red';
            return `<span class="badge ${cls}">${statusCode}</span>`;
        }

        let currentPage = 0;
        let totalPages = 0;

        async function loadFilterOptions() {
            try {
                const response = await apiCall('/api/audit/filter-options');
                const result = await response.json();
                if (result.success && result.data) {
                    const actionSelect = document.getElementById('action-filter');
                    const entitySelect = document.getElementById('entity-type-filter');
                    if (result.data.actions) {
                        actionSelect.innerHTML = '<option value="">All Actions</option>' + result.data.actions.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
                    }
                    if (result.data.entityTypes) {
                        entitySelect.innerHTML = '<option value="">All Types</option>' + result.data.entityTypes.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
                    }
                }
            } catch(e) { console.error('filter options error', e); }
        }

        async function loadAuditLogs(page) {
            const tbody = document.getElementById('audit-table-body');
            tbody.innerHTML = '<tr><td colspan="6" style="padding:48px 16px;text-align:center;">Loading...</td></tr>';

            let url = `/api/audit/logs?page=${page}&size=50`;
            const action = document.getElementById('action-filter').value;
            const entityType = document.getElementById('entity-type-filter').value;
            const actor = document.getElementById('actor-filter').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;
            const statusGroup = document.getElementById('status-filter').value;

            if (action) url += `&action=${encodeURIComponent(action)}`;
            if (entityType) url += `&entityType=${encodeURIComponent(entityType)}`;
            if (actor) url += `&actor=${encodeURIComponent(actor)}`;
            if (dateFrom) url += `&startDate=${encodeURIComponent(dateFrom)}`;
            if (dateTo) url += `&endDate=${encodeURIComponent(dateTo)}`;
            if (statusGroup) url += `&statusGroup=${encodeURIComponent(statusGroup)}`;

            try {
                const response = await apiCall(url);
                const result = await response.json();
                if (result.success && result.data) {
                    const logs = result.data.content || [];
                    currentPage = result.data.number || 0;
                    totalPages = result.data.totalPages || 0;
                    if (logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="padding:48px 16px;text-align:center;color:#9ca3af;">No audit logs found</td></tr>';
                    } else {
                        tbody.innerHTML = logs.map(log => `
                            <tr style="border-bottom:1px solid #f1f5f9;">
                                <td style="padding:14px 16px; font-size:12px; font-family:'DM Mono',monospace;">${formatDate(log.createdAt)}</td>
                                <td style="padding:14px 16px;"><span class="font-medium">${escapeHtml(log.actorEmail)}</span></td>
                                <td style="padding:14px 16px;"><code class="text-xs bg-gray-100 px-2 py-1 rounded">${escapeHtml(log.action)}</code></td>
                                <td style="padding:14px 16px;"><div class="text-sm">${escapeHtml(log.entityType || '-')}</div><div class="text-xs text-gray-400">ID: ${escapeHtml(log.entityId || '-')}</div></td>
                                <td style="padding:14px 16px;">${getStatusBadge(log.statusCode)}</td>
                                <td style="padding:14px 16px;"><div class="text-sm">${escapeHtml(log.requestPath || '-')}</div><div class="text-xs text-gray-400">${escapeHtml(log.details || '-')}</div></td>
                            </tr>
                        `).join('');
                    }
                    renderPagination();
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="padding:48px 16px;text-align:center;color:#ef4444;">Failed to load logs</td></tr>';
                }
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="6" style="padding:48px 16px;text-align:center;color:#ef4444;">Error loading logs</td></tr>';
            }
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = `
                <div class="text-sm text-gray-500">Page ${currentPage + 1} of ${totalPages}</div>
                <div class="flex gap-2">
                    <button id="prev-page" class="btn-secondary text-sm" ${currentPage === 0 ? 'disabled' : ''}>Previous</button>
                    <button id="next-page" class="btn-primary text-sm" ${currentPage + 1 >= totalPages ? 'disabled' : ''}>Next</button>
                </div>
            `;
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            if (prevBtn) prevBtn.addEventListener('click', () => loadAuditLogs(currentPage - 1));
            if (nextBtn) nextBtn.addEventListener('click', () => loadAuditLogs(currentPage + 1));
        }

        // Event listeners
        document.getElementById('apply-filters')?.addEventListener('click', () => loadAuditLogs(0));
        document.getElementById('clear-filters')?.addEventListener('click', () => {
            document.getElementById('action-filter').value = '';
            document.getElementById('entity-type-filter').value = '';
            document.getElementById('actor-filter').value = '';
            document.getElementById('status-filter').value = '';
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            loadAuditLogs(0);
        });
        document.getElementById('refresh-btn')?.addEventListener('click', () => loadAuditLogs(currentPage));

        // Initial load
        loadFilterOptions();
        loadAuditLogs(0);
    })();
</script>
