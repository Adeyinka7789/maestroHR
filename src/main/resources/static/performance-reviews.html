<!-- performance-reviews.html – content partial only -->
<style>
    /* Page‑specific styles (tab buttons) */
    .tab-btn {
        padding: 9px 18px; border-radius: 8px; cursor: pointer;
        font-size: 13.5px; font-weight: 500; border: none;
        transition: background 0.15s, color 0.15s;
        background: #f1f5f9; color: #64748b;
    }
    .tab-btn:hover { background: #e2e8f0; }
    .tab-btn.active { background: #2563eb; color: white; }
</style>

<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Performance Reviews</h1>
            <p class="page-subtitle">Manage employee evaluations and performance tracking</p>
        </div>
        <button id="create-review-btn" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Review Cycle
        </button>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Pending Reviews</div><div id="stats-pending" style="font-size:28px;font-weight:600;margin-top:8px;">0</div></div>
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Completed</div><div id="stats-completed" style="font-size:28px;font-weight:600;margin-top:8px;">0</div></div>
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Overdue</div><div id="stats-overdue" style="font-size:28px;font-weight:600;margin-top:8px;">0</div></div>
        <div class="stat-card"><div style="font-size:12px;color:#64748b;text-transform:uppercase;">Avg Rating</div><div id="stats-rating" style="font-size:28px;font-weight:600;margin-top:8px;">0.0</div></div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid #e2e8f0;padding-bottom:12px;">
        <button id="tab-cycles" class="tab-btn active">📋 Review Cycles</button>
        <button id="tab-templates" class="tab-btn">📝 Templates</button>
    </div>

    <!-- Review Cycles List -->
    <div id="cycles-view">
        <div class="card" style="overflow:hidden;">
            <div class="overflow-x-auto">
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                        <th class="p-3 text-left">Employee</th>
                        <th class="p-3 text-left">Template</th>
                        <th class="p-3 text-left">Period</th>
                        <th class="p-3 text-left">Status</th>
                        <th class="p-3 text-left">Due Date</th>
                        <th class="p-3 text-left">Rating</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="cycles-table-body">
                    <tr><td colspan="7" class="p-8 text-center text-gray-400">Loading review cycles...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Templates List (hidden by default) -->
    <div id="templates-view" style="display:none;">
        <div class="card" style="overflow:hidden;">
            <div class="overflow-x-auto">
                <table class="data-table" style="width:100%;border-collapse:collapse;">
                    <thead>
                    <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                        <th class="p-3 text-left">Template Name</th>
                        <th class="p-3 text-left">Type</th>
                        <th class="p-3 text-left">Description</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="templates-table-body">
                    <tr><td colspan="4" class="p-8 text-center text-gray-400">Loading templates...</span></td>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Use global MaestroHR helpers
        const token = MaestroHR.token;
        const userRole = MaestroHR.userRole;
        const apiCall = MaestroHR.apiCall.bind(MaestroHR);
        const showToast = MaestroHR.showToast.bind(MaestroHR);
        const escapeHtml = MaestroHR.escapeHtml.bind(MaestroHR);

        async function loadCycles() {
            try {
                const res = await apiCall('/api/performance/cycles');
                const result = await res.json();
                const tbody = document.getElementById('cycles-table-body');
                if (result.success && result.data && result.data.content) {
                    const cycles = result.data.content;
                    if (cycles.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">No review cycles found. Click "New Review Cycle" to create one.</span></td>';
                        return;
                    }
                    tbody.innerHTML = cycles.map(cycle => {
                        let badgeClass = 'badge-gray';
                        let statusText = cycle.status || 'PENDING';
                        if (statusText === 'COMPLETED') badgeClass = 'badge-green';
                        else if (statusText === 'OVERDUE') badgeClass = 'badge-red';
                        else if (statusText === 'IN_PROGRESS') badgeClass = 'badge-amber';
                        else badgeClass = 'badge-blue';
                        return `
                            <tr class="border-b">
                                <td class="p-3 font-medium">${escapeHtml(cycle.employee?.fullName || cycle.employeeName || '—')}</td>
                                <td class="p-3">${escapeHtml(cycle.template?.name || '—')}</td>
                                <td class="p-3">${cycle.periodStart || '—'} to ${cycle.periodEnd || '—'}</td>
                                <td class="p-3"><span class="badge ${badgeClass}">${statusText}</span></td>
                                <td class="p-3">${cycle.dueDate ? new Date(cycle.dueDate).toLocaleDateString() : '—'}</td>
                                <td class="p-3">${cycle.overallRating || '—'}</td>
                                <td class="p-3 text-center">
                                    <button class="view-review-btn btn-secondary" data-id="${cycle.id}" style="font-size:12px;padding:4px 10px;">View</button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">No review cycles found.</span></td>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('cycles-table-body').innerHTML = '<tr><td colspan="7" class="p-8 text-center text-red-500">Failed to load review cycles. Please try again.</span></table>';
            }
        }

        async function loadTemplates() {
            try {
                const res = await apiCall('/api/performance/templates');
                const result = await res.json();
                const tbody = document.getElementById('templates-table-body');
                if (result.success && result.data && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(template => `
                        <tr class="border-b">
                            <td class="p-3 font-medium">${escapeHtml(template.name)}</td>
                            <td class="p-3"><span class="badge badge-blue">${template.reviewType || 'ANNUAL'}</span></td>
                            <td class="p-3">${escapeHtml(template.description || '—')}</td>
                            <td class="p-3 text-center">
                                <button class="edit-template-btn btn-secondary" data-id="${template.id}" data-name="${escapeHtml(template.name)}" data-type="${template.reviewType}" data-desc="${escapeHtml(template.description || '')}" style="font-size:12px;padding:4px 10px;margin-right:5px;">Edit</button>
                                <button class="delete-template-btn btn-danger" data-id="${template.id}" style="font-size:12px;padding:4px 10px;">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400">No templates found. Click "New Review Cycle" to create a template.</span></td>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('templates-table-body').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500">Failed to load templates. Please try again.</span></tr>';
            }
        }

        async function loadStats() {
            try {
                const res = await apiCall('/api/performance/stats');
                const result = await res.json();
                if (result.success && result.data) {
                    document.getElementById('stats-pending').textContent = result.data.pendingReviews || 0;
                    document.getElementById('stats-completed').textContent = result.data.completedReviews || 0;
                    document.getElementById('stats-overdue').textContent = result.data.overdueReviews || 0;
                    document.getElementById('stats-rating').textContent = result.data.averageRating || '0.0';
                } else {
                    document.getElementById('stats-pending').textContent = '0';
                    document.getElementById('stats-completed').textContent = '0';
                    document.getElementById('stats-overdue').textContent = '0';
                    document.getElementById('stats-rating').textContent = '0.0';
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Modal for template creation/editing (kept as in original, but uses apiCall)
        function openTemplateModal(templateData = null) {
            const isEdit = templateData !== null;
            const modalHtml = `
                <div id="template-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;">
                    <div style="background:white;border-radius:12px;max-width:500px;width:90%;padding:28px;">
                        <h3 style="font-size:18px;font-weight:600;margin-bottom:20px;">${isEdit ? 'Edit' : 'Create'} Review Template</h3>
                        <div style="display:grid;gap:16px;">
                            <input type="text" id="template-name" placeholder="Template Name" class="form-input" value="${isEdit ? escapeHtml(templateData.name) : ''}">
                            <select id="template-type" class="form-input">
                                <option value="ANNUAL" ${isEdit && templateData.reviewType === 'ANNUAL' ? 'selected' : ''}>Annual</option>
                                <option value="QUARTERLY" ${isEdit && templateData.reviewType === 'QUARTERLY' ? 'selected' : ''}>Quarterly</option>
                                <option value="MONTHLY" ${isEdit && templateData.reviewType === 'MONTHLY' ? 'selected' : ''}>Monthly</option>
                                <option value="PROBATION" ${isEdit && templateData.reviewType === 'PROBATION' ? 'selected' : ''}>Probation</option>
                            </select>
                            <textarea id="template-description" placeholder="Description (optional)" rows="3" class="form-input">${isEdit ? escapeHtml(templateData.description) : ''}</textarea>
                            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
                                <button id="close-modal-btn" class="btn-secondary">Cancel</button>
                                <button id="save-template-btn" class="btn-primary" data-id="${isEdit ? templateData.id : ''}">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('close-modal-btn').addEventListener('click', () => {
                document.getElementById('template-modal').remove();
            });
            document.getElementById('save-template-btn').addEventListener('click', async () => {
                const name = document.getElementById('template-name').value.trim();
                const reviewType = document.getElementById('template-type').value;
                const description = document.getElementById('template-description').value;
                if (!name) {
                    showToast('Template name is required', 'error');
                    return;
                }
                const payload = { name, reviewType, description };
                const isEditing = document.getElementById('save-template-btn').dataset.id;
                const url = isEditing ? `/api/performance/templates/${isEditing}` : '/api/performance/templates';
                const method = isEditing ? 'PUT' : 'POST';
                try {
                    const res = await apiCall(url, { method, body: JSON.stringify(payload) });
                    const result = await res.json();
                    if (res.ok) {
                        showToast(isEditing ? 'Template updated' : 'Template created', 'success');
                        document.getElementById('template-modal').remove();
                        loadTemplates();
                    } else {
                        showToast(result.error || 'Failed to save template', 'error');
                    }
                } catch (err) {
                    showToast('Error saving template', 'error');
                }
            });
        }

        // Tab switching
        document.getElementById('tab-cycles').addEventListener('click', () => {
            document.getElementById('cycles-view').style.display = 'block';
            document.getElementById('templates-view').style.display = 'none';
            document.getElementById('tab-cycles').classList.add('active');
            document.getElementById('tab-templates').classList.remove('active');
            loadCycles();
        });
        document.getElementById('tab-templates').addEventListener('click', () => {
            document.getElementById('cycles-view').style.display = 'none';
            document.getElementById('templates-view').style.display = 'block';
            document.getElementById('tab-templates').classList.add('active');
            document.getElementById('tab-cycles').classList.remove('active');
            loadTemplates();
        });

        document.getElementById('create-review-btn').addEventListener('click', () => {
            openTemplateModal();
        });

        // Handle edit/delete clicks (event delegation)
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-template-btn')) {
                const templateData = {
                    id: e.target.dataset.id,
                    name: e.target.dataset.name,
                    reviewType: e.target.dataset.type,
                    description: e.target.dataset.desc
                };
                openTemplateModal(templateData);
            }
            if (e.target.classList.contains('delete-template-btn')) {
                const id = e.target.dataset.id;
                if (!confirm('Delete this template? This action cannot be undone.')) return;
                apiCall(`/api/performance/templates/${id}`, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            showToast('Template deleted', 'success');
                            loadTemplates();
                        } else {
                            showToast('Failed to delete template', 'error');
                        }
                    })
                    .catch(() => showToast('Error deleting template', 'error'));
            }
            if (e.target.classList.contains('view-review-btn')) {
                showToast('Review details feature coming soon', 'info');
            }
        });

        // Initial load
        loadCycles();
        loadTemplates();
        loadStats();
    })();
</script>
