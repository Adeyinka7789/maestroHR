<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaestroHR — Reset your password</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/images/maestrohr-icon.svg">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#00236f; --primary-dark:#001a54; --text-main:#0f172a; --text-muted:#64748b; --bg-page:#f8fafc; --border:#e2e8f0; }
        * { -webkit-font-smoothing:antialiased; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-page); min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; }
        .auth-container { width:100%; max-width:440px; padding:20px; }
        .card { background:white; border:1px solid var(--border); border-radius:20px; padding:40px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.04),0 8px 10px -6px rgba(0,0,0,0.04); }
        .logo-header { display:flex; align-items:center; gap:12px; margin-bottom:32px; text-decoration:none; }
        .logo-box { width:36px; height:36px; background:#fff;border:1px solid #e2e8f0; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .logo-text { font-family:'Outfit',sans-serif; font-size:20px; font-weight:700; color:var(--text-main); }
        .form-label { display:block; font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:8px; }
        .form-input { width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:10px; font-size:15px; color:var(--text-main); background:#fff; transition:all 0.2s; outline:none; font-family:'Inter',sans-serif; }
        .form-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(0,35,111,0.12); }
        .form-input::placeholder { color:#94a3b8; }
        .btn-primary { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Inter',sans-serif; }
        .btn-primary:hover:not(:disabled) { background:var(--primary-dark); transform:translateY(-1px); }
        .btn-primary:disabled { opacity:0.65; cursor:not-allowed; transform:none; }
        .error-box { background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:12px 14px; color:#991b1b; font-size:14px; display:none; margin-bottom:24px; line-height:1.5; }
        .info-box { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:12px 14px; color:#166534; font-size:14px; display:none; margin-bottom:24px; line-height:1.5; }
        .footer-link { text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); }
        .footer-link a { color:var(--primary); font-weight:600; text-decoration:none; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="card">
        <a href="/" class="logo-header">
            <div class="logo-box">
                <svg width="24" height="24" viewBox="0 0 512 512" fill="none"><rect x="120" y="150" width="40" height="196" fill="#00236F"/><rect x="182" y="234" width="40" height="112" fill="#00236F"/><rect x="244" y="192" width="40" height="154" fill="#0E8A62"/><rect x="306" y="234" width="40" height="112" fill="#00236F"/><rect x="368" y="150" width="40" height="196" fill="#00236F"/></svg>
            </div>
            <span class="logo-text">MaestroHR</span>
        </a>

        <h1 style="font-family:'Outfit';font-size:26px;color:var(--text-main);margin:0 0 8px;">Reset your password</h1>
        <p style="font-size:15px;color:var(--text-muted);margin:0 0 32px;">Enter your work email and we'll send you a reset link</p>

        <div class="error-box" id="error-box"></div>
        <div class="info-box" id="info-box"></div>

        <div style="display:flex;flex-direction:column;gap:20px;">
            <div>
                <label class="form-label" for="email">Work Email</label>
                <input class="form-input" type="email" id="email" placeholder="name@company.com" autocomplete="email">
            </div>
            <button class="btn-primary" id="submit-btn" style="margin-top:8px;">
                <span id="btn-text">Send Reset Link</span>
                <svg id="btn-spinner" style="display:none;animation:spin 0.8s linear infinite;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                    <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" stroke-opacity="0.2"/>
                    <path d="M12 3a9 9 0 0 1 9 9"/>
                </svg>
            </button>
        </div>

        <div class="footer-link"><a href="/login">&larr; Back to login</a></div>
    </div>
    <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:32px;">&copy; 2026 MaestroHR Technologies. Built for Nigerian SMEs.</p>
</div>

<script>
    (function () {
        var emailInput = document.getElementById('email');
        var submitBtn  = document.getElementById('submit-btn');
        var errorBox   = document.getElementById('error-box');
        var infoBox    = document.getElementById('info-box');
        var btnText    = document.getElementById('btn-text');
        var btnSpinner = document.getElementById('btn-spinner');

        emailInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSubmit(); });
        submitBtn.addEventListener('click', doSubmit);

        async function doSubmit() {
            var email = emailInput.value.trim();

            errorBox.style.display = 'none';
            infoBox.style.display  = 'none';

            if (!email) {
                showError('Please enter your work email address.');
                emailInput.focus();
                return;
            }

            setLoading(true);

            try {
                var res = await fetch('/api/auth/forgot-password', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email: email })
                });
                var result = await res.json();
                if (!res.ok) {
                    showError(result.message || 'Could not process your request. Please try again.');
                    return;
                }
                showInfo('If an account exists for that email, a reset link has been sent. Check your inbox.');
                submitBtn.disabled = true;
            } catch (err) {
                showError('Connection error. Please check your internet and try again.');
            } finally {
                setLoading(false);
            }
        }

        function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
        function showInfo(msg)  { infoBox.textContent = msg; infoBox.style.display = 'block'; }

        function setLoading(on) {
            submitBtn.disabled       = on;
            btnText.textContent      = on ? 'Sending...' : 'Send Reset Link';
            btnSpinner.style.display = on ? 'block' : 'none';
        }
    })();
</script>
</body>
</html>
