<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Careers at ' + ${company.companyName()}">Careers</title>
    <style>
        :root { --brand:#00236f; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }
        .top { background:var(--brand); color:#fff; padding:22px 20px; }
        .wrap { max-width:840px; margin:0 auto; padding:0 20px; }
        .brand { display:flex; align-items:center; gap:14px; }
        .brand img { height:44px; width:44px; object-fit:contain; background:#fff; border-radius:8px; padding:4px; }
        .brand h1 { margin:0; font-size:22px; font-weight:700; }
        .intro { margin:24px auto 8px; font-size:15px; line-height:1.6; color:var(--muted); }
        .count { margin:24px auto 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
        .job { display:block; text-decoration:none; color:inherit; background:#fff; border:1px solid var(--line);
               border-radius:12px; padding:18px 20px; margin:0 auto 14px; transition:box-shadow .15s, transform .15s; }
        .job:hover { box-shadow:0 6px 18px rgba(15,23,42,.08); transform:translateY(-1px); }
        .job h3 { margin:0 0 6px; font-size:17px; color:var(--brand); }
        .meta { font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:12px; }
        .tag { display:inline-block; background:#eef2ff; color:var(--brand); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
        .empty { background:#fff; border:1px dashed var(--line); border-radius:12px; padding:40px 20px; text-align:center; color:var(--muted); }
        footer { text-align:center; color:#94a3b8; font-size:12px; padding:32px 20px; }
    </style>
</head>
<body>
<div class="top">
    <div class="wrap brand">
        <img th:if="${company.logoUrl()}" th:src="${company.logoUrl()}" alt="logo">
        <h1 th:text="'Careers at ' + ${company.companyName()}">Careers</h1>
    </div>
</div>
<div class="wrap">
    <p class="intro" th:if="${company.careersIntro()}" th:text="${company.careersIntro()}">Company intro.</p>

    <p class="count" th:if="${!jobs.isEmpty()}"
       th:text="${jobs.size()} + (${jobs.size()} == 1 ? ' open position' : ' open positions')">Open positions</p>

    <div class="empty" th:if="${jobs.isEmpty()}">
        There are no open positions right now. Please check back soon.
    </div>

    <a class="job" th:each="job : ${jobs}"
       th:href="@{'/careers/' + ${slug} + '/jobs/' + ${job.id()}}">
        <h3 th:text="${job.title()}">Job title</h3>
        <div class="meta">
            <span class="tag" th:if="${job.employmentType()}" th:text="${#strings.replace(job.employmentType(),'_',' ')}">FULL TIME</span>
            <span th:if="${job.department()}" th:text="${job.department()}">Department</span>
            <span th:if="${job.location()}" th:text="'📍 ' + ${job.location()}">Location</span>
            <span th:if="${job.closingDate()}" th:text="'Closes ' + ${#temporals.format(job.closingDate(),'d MMM yyyy')}">Closes</span>
        </div>
    </a>
</div>
<footer>Powered by MaestroHR</footer>
</body>
</html>
