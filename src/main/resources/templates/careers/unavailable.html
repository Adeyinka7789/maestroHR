<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers page unavailable</title>
    <style>
        body { margin:0; font-family:Arial,Helvetica,sans-serif; color:#0f172a; background:#f1f5f9;
               display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
        .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:44px 36px;
                max-width:460px; text-align:center; box-shadow:0 8px 28px rgba(15,23,42,.08); }
        h1 { margin:0 0 12px; font-size:22px; color:#00236f; }
        p { margin:0; font-size:15px; line-height:1.6; color:#475569; }
        .mark { font-size:44px; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="card">
    <div class="mark">🔍</div>
    <h1>Page unavailable</h1>
    <p th:text="${reason} ?: 'This careers page could not be found.'">This careers page could not be found.</p>
</div>
</body>
</html>
