<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application received</title>
    <style>
        body { margin:0; font-family:Arial,Helvetica,sans-serif; color:#0f172a; background:#f1f5f9;
               display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
        .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:44px 36px;
                max-width:460px; text-align:center; box-shadow:0 8px 28px rgba(15,23,42,.08); }
        .check { width:64px; height:64px; border-radius:50%; background:#dcfce7; color:#16a34a;
                 font-size:34px; line-height:64px; margin:0 auto 20px; }
        h1 { margin:0 0 12px; font-size:22px; color:#00236f; }
        p { margin:0 0 22px; font-size:15px; line-height:1.6; color:#475569; }
        a { display:inline-block; background:#00236f; color:#fff; text-decoration:none;
            padding:12px 26px; border-radius:8px; font-size:14px; font-weight:600; }
    </style>
</head>
<body>
<div class="card">
    <div class="check">✓</div>
    <h1>Application received</h1>
    <p>Thank you for applying. We've sent a confirmation to your email, and the hiring team will be in touch if your profile is a match.</p>
    <a th:href="@{'/careers/' + ${slug}}">View more positions</a>
</div>
</body>
</html>
